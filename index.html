<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
:root{
  color-scheme:light;
  --font-primary:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --font-display:var(--font-primary);
  --font-mono:var(--font-primary);
  --primary-normal:#7132f5;
  --primary-strong:#5741d8;
  --primary-deep:#5b1ecf;
  --primary-subtle:rgba(133,91,251,.16);
  --static-white:#fff;
  --label-normal:#101114;
  --label-neutral:#484b5e;
  --label-alternative:#9497a9;
  --line-normal-neutral:rgba(104,107,130,.12);
  --line-normal-normal:rgba(104,107,130,.24);
  --line-normal-strong:#dedee5;
  --background-normal-normal:#fff;
  --background-normal-alternative:rgba(148,151,169,.08);
  --surface-pearl:#fff;
  --cool-grey-25:#fff;
  --cool-grey-50:rgba(148,151,169,.08);
  --cool-grey-100:rgba(104,107,130,.12);
  --cool-grey-200:#dedee5;
  --radius-xs:6px;
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:16px;
  --radius-pill:12px;
  --shadow-popover:0 4px 24px rgba(0,0,0,.03),0 1px 4px rgba(16,24,40,.04);
  --type-tracking-normal:0;
}

<style>
html, body {height:100%; margin:0}
#mapWrap {position:relative; width:100%; height:100%}
#map {width:100%; height:100%; position:relative; isolation:isolate}

/* ============ Kraken design system — map control chrome ============ */
.top-navigation{
  position:absolute;
  z-index:1150;
  top:0;
  right:0;
  left:0;
  display:grid;
  grid-template-columns:minmax(520px, 1fr) auto minmax(520px, 1fr);
  align-items:center;
  gap:20px;
  min-height:68px;
  padding:12px 16px;
  box-sizing:border-box;
  overflow:visible;
  border-bottom:1px solid var(--cool-grey-200);
  background:#fff;
  box-shadow:0 2px 10px rgba(34,43,54,.08);
  font-family:var(--font-primary);
  scrollbar-width:thin;
}
.brand-theme-controls{
  display:flex;
  min-width:0;
  align-items:center;
  justify-self:start;
  gap:20px;
  white-space:nowrap;
}
.site-logo{
  color:var(--label-normal);
  font-family:var(--font-primary);
  font-size:21px;
  font-weight:900;
  letter-spacing:-.035em;
  line-height:1;
}
.theme-control{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--label-neutral);
  font-size:13px;
  font-weight:800;
}
.theme-select{
  height:42px;
  min-width:156px;
  padding:0 34px 0 13px;
  border:1px solid var(--cool-grey-200);
  border-radius:var(--radius-sm);
  background:var(--cool-grey-50);
  color:var(--label-normal);
  font-family:var(--font-primary);
  font-size:13px;
  font-weight:700;
  outline:none;
  cursor:pointer;
}
.theme-select:focus{
  border-color:var(--primary-normal);
  box-shadow:0 0 0 3px rgba(51,102,255,.14);
}
.brand-theme-controls .export-map-button{
  display:flex;
  align-items:center;
  justify-content:center;
  height:42px;
  min-width:72px;
  padding:0 14px;
  border:1px solid var(--cool-grey-200);
  border-radius:var(--radius-sm);
  background:var(--cool-grey-50);
  box-shadow:none;
  color:var(--label-neutral);
  font-family:var(--font-primary);
  font-size:13px;
  font-weight:800;
  cursor:pointer;
}
.brand-theme-controls .export-map-button:hover{
  border-color:var(--line-normal-strong);
  background:var(--cool-grey-100);
}
.brand-theme-controls .export-map-button:disabled{
  border-color:var(--cool-grey-200);
  background:var(--cool-grey-50);
  color:var(--label-alternative);
  cursor:wait;
}
body.exporting-map .top-navigation,
body.exporting-map .buttons{
  display:none !important;
}
.right-controls{
  display:flex;
  min-width:0;
  align-items:center;
  justify-self:end;
  gap:5px;
  white-space:nowrap;
}
.right-controls .control-btn{
  min-height:38px;
  padding:8px 9px;
  border-color:var(--cool-grey-200);
  background:var(--cool-grey-50);
  box-shadow:none;
  font-size:12px;
  white-space:nowrap;
}
.address-search{
  position:relative;
  z-index:1;
  display:flex;
  flex:none;
  flex-wrap:nowrap;
  align-items:center;
  justify-self:center;
  gap:6px;
  width:auto;
  font-family:var(--font-primary);
}
.address-search input{
  flex:0 1 420px;
  width:420px;
  min-width:0;
  height:44px;
  box-sizing:border-box;
  padding:0 16px;
  border:1px solid var(--line-normal-normal, rgba(112,115,124,0.22));
  border-radius:var(--radius-sm, 12px);
  background:var(--cool-grey-25);
  box-shadow:none;
  font-family:var(--font-primary);
  font-size:15px;
  font-weight:500;
  letter-spacing:var(--type-tracking-normal, 0.006em);
  color:var(--label-normal, rgb(23,23,23));
  outline:none;
  transition:border-color .12s ease, box-shadow .12s ease;
}
.address-search input::placeholder{
  color:var(--label-alternative, rgba(55,56,60,0.61));
}
.address-search input:focus{
  border-color:var(--primary-normal, rgb(51,102,255));
  box-shadow:0 0 0 3px rgba(51,102,255,.16), var(--shadow-popover, 0 4px 16px rgba(23,23,23,.10));
}
.address-search button{
  flex:0 0 auto;
  height:44px;
  padding:0 14px;
  border:1px solid var(--cool-grey-200);
  border-radius:var(--radius-sm, 12px);
  background:var(--cool-grey-100);
  color:var(--label-neutral, rgba(46,47,51,0.88));
  font-family:var(--font-primary);
  font-size:15px;
  font-weight:600;
  letter-spacing:var(--type-tracking-normal, 0.006em);
  cursor:pointer;
  box-shadow:none;
  transition:background .12s ease, border-color .12s ease;
}
.address-search button:hover{
  background:#e5eaef;
  border-color:#cdd5dd;
}
.address-search button:disabled{
  border-color:var(--cool-grey-200);
  background:var(--cool-grey-50);
  color:var(--label-alternative);
  cursor:not-allowed;
}
/* the 핀 숨김/표시 secondary button */
.address-search #toggleAddressMarker{
  background:var(--background-normal-normal, #fff);
  color:var(--label-neutral, rgba(46,47,51,0.88));
  border:1px solid var(--line-normal-normal, rgba(112,115,124,0.22));
}
.address-search #toggleAddressMarker:hover{
  background:var(--background-normal-alternative, rgb(248,248,249));
  border-color:var(--line-normal-strong, rgba(112,115,124,0.52));
}
.address-search #toggleSearchHistory{
  width:38px;
  padding:0;
}
.search-history-chevron{
  display:inline-block;
  font-size:11px;
  transition:transform .14s ease;
}
#toggleSearchHistory[aria-expanded="true"] .search-history-chevron{
  transform:rotate(180deg);
}

.search-results,
.search-history-panel{
  position:absolute;
  z-index:1200;
  top:calc(100% + 8px);
  left:0;
  width:420px;
  max-width:calc(100vw - 24px);
  display:none;
  max-height:300px;
  overflow:auto;
  border:1px solid var(--line-normal-normal, rgba(112,115,124,0.22));
  border-radius:var(--radius-md, 16px);
  background:var(--background-normal-normal, #fff);
  box-shadow:var(--shadow-popover, 0 4px 16px rgba(23,23,23,.10));
}
.search-results.is-open{
  display:block;
}
.search-history-panel.is-open{
  display:block;
}
.search-history-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:42px;
  padding:0 12px 0 14px;
  border-bottom:1px solid var(--line-normal-neutral);
  color:var(--label-neutral);
  font-size:13px;
}
.address-search .search-history-clear{
  width:auto;
  height:28px;
  padding:0 8px;
  border:0;
  background:transparent;
  color:var(--label-alternative);
  font-size:12px;
  box-shadow:none;
}
.address-search .search-history-item{
  display:flex;
  align-items:center;
  width:100%;
  height:auto;
  min-height:42px;
  padding:10px 14px;
  border:0;
  border-bottom:1px solid var(--line-normal-neutral);
  border-radius:0;
  background:#fff;
  color:var(--label-normal);
  box-shadow:none;
  font-size:13px;
  text-align:left;
}
.address-search .search-history-item:last-child{ border-bottom:0; }
.address-search .search-history-item:hover{ background:var(--cool-grey-50); }
.address-search .search-result{
  display:flex;
  align-items:stretch;
  width:100%;
  height:auto;
  padding:0;
  border:0;
  border-bottom:1px solid var(--line-normal-neutral, rgba(112,115,124,0.16));
  border-radius:0;
  background:var(--background-normal-normal, #fff);
  color:var(--label-normal, rgb(23,23,23));
  box-shadow:none;
  line-height:1.4;
  transition:background .1s ease;
}
.address-search .search-result:last-child{
  border-bottom:0;
}
.address-search .search-result.is-selected{
  background:rgba(51,102,255,.08);
}
.address-search .search-result-main{
  display:block;
  flex:1 1 auto;
  min-width:0;
  height:auto;
  padding:12px 14px;
  border:0;
  border-radius:0;
  background:transparent;
  box-shadow:none;
  color:inherit;
  text-align:left;
}
.address-search .search-result-main:hover{
  border-color:transparent;
  background:rgba(51,102,255,.06);
}
.address-search .search-result-add{
  align-self:center;
  height:32px;
  margin:8px 10px 8px 0;
  padding:0 11px;
  border-color:rgba(51,102,255,.34);
  border-radius:9px;
  background:rgba(51,102,255,.08);
  color:var(--primary-strong);
  font-size:12px;
  font-weight:800;
}
.address-search .search-result-add:hover{
  border-color:var(--primary-normal);
  background:rgba(51,102,255,.14);
}
.address-search .search-result-add:disabled{
  border-color:var(--cool-grey-200);
  background:var(--cool-grey-50);
  color:var(--label-alternative);
}
.search-result-main strong{
  display:block;
  margin-bottom:4px;
  font-size:14px;
  font-weight:600;
  color:var(--label-normal, rgb(23,23,23));
}
.search-result-main > span,
.search-empty{
  display:block;
  color:var(--label-alternative, rgba(55,56,60,0.61));
  font-size:13px;
  font-weight:500;
  word-break:keep-all;
}
.search-empty{
  padding:14px 16px;
  font-family:var(--font-primary);
}
.search-map-pin{
  position:relative;
  display:block;
  width:30px;
  height:38px;
  cursor:context-menu;
  filter:drop-shadow(0 3px 4px rgba(23,23,23,.28));
}
.search-map-pin::before{
  position:absolute;
  top:3px;
  left:4px;
  width:22px;
  height:22px;
  border:2px solid #fff;
  border-radius:50% 50% 50% 0;
  background:var(--pin-color);
  content:"";
  transform:rotate(-45deg);
}
.search-map-pin::after{
  position:absolute;
  top:10px;
  left:11px;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#fff;
  content:"";
}

.buttons{
  position:absolute;
  z-index:1000;
  top:78px;
  left:16px;
  background:none;
  padding:0;
  border-radius:0;
  box-shadow:none;
  display:inline-block;
  font-family:var(--font-primary);
}
/* group containing theme/type buttons */
.primary-controls{
  display:flex;
  flex:0 0 auto;
  gap:3px;
  flex-wrap:nowrap;
}
/* group containing the 시도 및 시군구 토글 */
.secondary-controls{
  --secondary-control-gap:6px;
  display:flex;
  gap:var(--secondary-control-gap);
  flex-wrap:nowrap;
  overflow-x:auto;
  max-width:calc(100vw - 32px);
  padding-bottom:2px;
  font-size:0.6em;
  margin-top:0;
}
.boundary-controls-row{
  gap:0;
}
.boundary-control-group{
  display:flex;
  align-items:center;
  flex:0 0 auto;
  gap:var(--secondary-control-gap);
}
.boundary-group-spacer{
  width:calc(var(--secondary-control-gap) * 8);
  flex:0 0 calc(var(--secondary-control-gap) * 8);
}
.secondary-controls .control-btn{
  font-size:inherit;
}
.fill-controls{
  margin-top:0;
}
.fill-mode-control select{
  max-width:92px;
  border:0;
  outline:0;
  background:transparent;
  color:inherit;
  font:inherit;
  font-family:var(--font-primary);
  font-weight:600;
  cursor:pointer;
}
.fill-blend-canvas,
.line-overlay-canvas{
  position:absolute;
  left:0;
  top:0;
  display:block;
  pointer-events:none;
}
.fill-blend-canvas{ z-index:900; }
.line-overlay-canvas{
  z-index:901;
  mix-blend-mode:normal;
}

/* Base utility control */
.control-btn{
  display:flex;
  align-items:center;
  gap:5px;
  border:1px solid var(--line-normal-normal, rgba(112,115,124,0.22));
  border-radius:var(--radius-sm, 12px);
  background:var(--background-normal-normal, #fff);
  color:var(--label-neutral, rgba(46,47,51,0.88));
  font-family:var(--font-primary);
  font-weight:600;
  letter-spacing:var(--type-tracking-normal, 0.006em);
  cursor:pointer;
  box-shadow:var(--shadow-popover, 0 4px 16px rgba(23,23,23,.10));
  transition:background .12s ease, border-color .12s ease, color .12s ease;
}
.control-btn:hover{
  background:var(--background-normal-alternative, rgb(248,248,249));
  border-color:var(--line-normal-strong, rgba(112,115,124,0.52));
}
.control-btn input[type="checkbox"]{
  margin:0 3px 0 0;
  accent-color:var(--primary-normal, rgb(51,102,255));
}
/* primary controls (theme / map type) */
.primary-controls .control-btn{
  padding:8px 6px;
  border-color:var(--cool-grey-200);
  background:var(--cool-grey-50);
  box-shadow:none;
  font-size:12px;
  white-space:nowrap;
}
.primary-controls .control-btn:hover{
  background:var(--cool-grey-100);
}
.primary-controls .control-btn.control-on{
  border-color:var(--primary-normal);
  background:var(--primary-normal);
  color:#fff;
}
/* secondary controls (per-sido toggles) */
.secondary-controls .control-btn{
  padding:6px 9px;
  border-radius:var(--radius-xs, 8px);
  flex:0 0 auto;
  white-space:nowrap;
}

.color-swatch{
  width:16px;
  height:16px;
  flex:0 0 16px;
  padding:0;
  border:1px solid var(--line-normal-normal, rgba(112,115,124,0.22));
  border-radius:50%;
  background:transparent;
  cursor:pointer;
  overflow:hidden;
  appearance:none;
  -webkit-appearance:none;
}
.color-swatch::-webkit-color-swatch-wrapper{ padding:0; }
.color-swatch::-webkit-color-swatch{ border:0; border-radius:50%; }
.color-swatch::-moz-color-swatch{ border:0; border-radius:50%; }

.line-weight-control > button,
.fill-opacity-control > button{
  border:0;
  background:transparent;
  color:inherit;
  font:inherit;
  font-family:var(--font-primary);
  font-weight:600;
  padding:0;
  cursor:pointer;
}
.line-weight-panel,
.fill-opacity-panel,
.fill-region-panel,
.line-region-panel{
  position:absolute;
  z-index:1200;
  display:none;
  border:1px solid var(--line-normal-normal, rgba(112,115,124,0.22));
  border-radius:var(--radius-md, 16px);
  background:var(--background-normal-normal, #fff);
  box-shadow:var(--shadow-popover, 0 4px 16px rgba(23,23,23,.10));
  color:var(--label-normal, rgb(23,23,23));
  font-family:var(--font-primary);
  white-space:nowrap;
}
.line-weight-panel,
.fill-opacity-panel{
  align-items:center;
  flex-direction:column;
  gap:8px;
  padding:12px 12px 14px;
}
.line-weight-panel.is-open,
.fill-opacity-panel.is-open{ display:flex; }
.line-weight-panel input[type="range"],
.fill-opacity-panel input[type="range"]{
  width:28px;
  height:120px;
  accent-color:var(--primary-normal, rgb(51,102,255));
  writing-mode:vertical-lr;
  direction:rtl;
}
.line-weight-value,
.fill-opacity-value{
  min-width:24px;
  text-align:center;
  font-family:var(--font-mono, "SF Mono", monospace);
  font-variant-numeric:tabular-nums;
  font-weight:600;
}

.fill-region-trigger,
.line-region-trigger{
  border:1px solid var(--line-normal-normal, rgba(112,115,124,0.22));
}
.fill-region-trigger .fill-region-chevron,
.line-region-trigger .fill-region-chevron{
  color:var(--label-alternative, rgba(55,56,60,0.61));
  font-size:10px;
  transition:transform .12s ease;
}
.fill-region-trigger[aria-expanded="true"] .fill-region-chevron,
.line-region-trigger[aria-expanded="true"] .fill-region-chevron{
  transform:rotate(180deg);
}
.fill-region-trigger.has-active-fill{
  border-color:var(--primary-normal, rgb(51,102,255));
  color:var(--primary-normal, rgb(51,102,255));
}
.line-region-trigger.has-active-line{
  border-color:var(--primary-normal, rgb(51,102,255));
  color:var(--primary-normal, rgb(51,102,255));
}
.fill-region-count:empty,
.line-region-count:empty{ display:none; }
.fill-region-count,
.line-region-count{
  min-width:16px;
  padding:1px 4px;
  border-radius:999px;
  background:var(--primary-normal, rgb(51,102,255));
  color:var(--static-white, #fff);
  font-size:10px;
  line-height:14px;
  text-align:center;
}
.fill-region-panel{
  width:190px;
  max-width:calc(100vw - 32px);
  padding:8px;
}
.fill-region-panel.is-open{ display:block; }
.fill-region-panel-header{
  padding:6px 8px 8px;
  color:var(--label-neutral, rgba(46,47,51,0.88));
  font-size:12px;
  font-weight:700;
}
.fill-region-options{
  max-height:min(320px, calc(100vh - 170px));
  overflow-y:auto;
  scrollbar-gutter:stable;
}
.fill-region-option{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:34px;
  padding:4px 8px;
  border-radius:8px;
  color:var(--label-normal, rgb(23,23,23));
  font-size:13px;
  font-weight:500;
  cursor:pointer;
}
.fill-region-option:hover{
  background:var(--background-normal-alternative, rgb(248,248,249));
}
.fill-region-option-all{
  position:sticky;
  z-index:1;
  top:0;
  margin-bottom:4px;
  padding-bottom:8px;
  border-bottom:1px solid var(--line-normal-normal, rgba(112,115,124,0.22));
  border-radius:0;
  background:var(--background-normal-normal, #fff);
  font-weight:700;
}
.fill-region-option input{
  margin:0;
  accent-color:var(--primary-normal, rgb(51,102,255));
}
.fill-region-loading,
.fill-region-error{
  padding:14px 8px;
  color:var(--label-alternative, rgba(55,56,60,0.61));
  font-size:12px;
  text-align:center;
}
.fill-region-error{ color:#d93025; }

/* Active toggle state */
.control-on{
  border-color:var(--primary-normal, rgb(51,102,255));
  background:var(--primary-normal, rgb(51,102,255));
  color:var(--static-white, #fff);
}
.control-on:hover{
  background:var(--primary-strong, rgb(44,90,232));
  border-color:var(--primary-strong, rgb(44,90,232));
}
body.ui-hidden .top-navigation{
  right:0;
  left:auto;
  display:flex;
  justify-content:flex-end;
  min-height:68px;
  padding:12px 16px;
  overflow:visible;
  border:0;
  background:transparent;
  box-shadow:none;
  pointer-events:none;
}
body.ui-hidden .brand-theme-controls,
body.ui-hidden .address-search,
body.ui-hidden .right-controls > :not(#TOGGLE_UI_VISIBILITY),
body.ui-hidden .buttons{
  display:none !important;
}
body.ui-hidden .right-controls{
  pointer-events:none;
}
body.ui-hidden #TOGGLE_UI_VISIBILITY{
  display:flex;
  pointer-events:auto;
  box-shadow:var(--shadow-popover);
}

</style>


<!-- Component-level adaptation of DESIGN-kraken.md for this dense map workspace. -->
<style>
html,body{
  color:var(--label-normal);
  font-family:var(--font-primary);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{ font-family:var(--font-primary); }

.top-navigation{
  grid-template-columns:minmax(480px,1fr) auto minmax(480px,1fr);
  gap:12px;
  min-height:48px;
  padding:6px 12px;

(() => {
  const originalGetContext = HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext = function(type, options){
    const isWebGlContext = type === 'webgl' || type === 'webgl2' || type === 'experimental-webgl';
    if(!isWebGlContext){
      return Reflect.apply(originalGetContext, this, [type, options]);
    }

    return Reflect.apply(originalGetContext, this, [type, {
      ...(options || {}),
      preserveDrawingBuffer: true
    }]);
  };
})();
</script>

function setGoogleJsonCopyResult(button, copySucceeded) {
  button.value = copySucceeded ? '복사됨' : '복사실패';
  button.dataset.copyStatus = copySucceeded ? 'success' : 'error';
  setTimeout(() => {
    button.value = GOOGLE_JSON_COPY_LABEL;
    delete button.dataset.copyStatus;
  }, 1600);
}

function copyTextWithTemporaryTextArea(text) {
  const textArea = document.createElement('textarea');
  textArea.value = text;
  textArea.setAttribute('readonly', '');
  textArea.style.position = 'fixed';
  textArea.style.opacity = '0';
  document.body.appendChild(textArea);
  textArea.select();
  try {
    return document.execCommand('copy');
  } finally {
    textArea.remove();
  }
}

async function copyGoogleStyleJson(button) {
  const jsonText = JSON.stringify(GOOGLE_STYLE_CONFIG, null, 2);
  let copySucceeded = false;
  button.value = '복사 중...';

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(jsonText);
      copySucceeded = true;
    } else {
      copySucceeded = copyTextWithTemporaryTextArea(jsonText);
    }
  } catch (error) {
    console.error('Google style JSON copy failed', error);
  }

  setGoogleJsonCopyResult(button, copySucceeded);
}

// GeoJSON 좌표 [lng, lat] 을 naver.maps.LatLng 객체로 변환
function coordsToLatLngs(coords) {
  return new naver.maps.LatLng(coords[1], coords[0]);
}

// Linear ring 배열을 Polyline 경로로 변환
function ringToPath(ring) {
  return ring.map(coordsToLatLngs);
}

function resolveFillBlendStyle(mode) {
  const style = FILL_BLEND_MODE_STYLES[mode] || FILL_BLEND_MODE_STYLES[DEFAULT_FILL_BLEND_MODE];
  if (window.CSS && typeof window.CSS.supports === 'function' && !window.CSS.supports('mix-blend-mode', style)) {
    if (style === 'plus-lighter') return 'screen';
    if (style === 'plus-darker') return 'darken';
    return 'normal';
  }
  return style;
}

function drawFillPolygonPaths(context, polygonPaths, projection) {
  context.beginPath();
  let hasPoints = false;
  polygonPaths.forEach(ring => {
    ring.forEach((coord, index) => {
      const point = projection.fromCoordToOffset(coord);
      if (!point || !Number.isFinite(point.x) || !Number.isFinite(point.y)) return;
      if (index === 0) context.moveTo(point.x, point.y);
      else context.lineTo(point.x, point.y);
      hasPoints = true;
    });
    context.closePath();
  });
  if (hasPoints) context.fill('evenodd');
}

function drawVisibleFillCanvas(context, projection) {
  Object.keys(lineLayers).forEach(kind => {
    const info = lineLayers[kind];
    if (!info.fillLoaded) return;
    context.save();
    context.fillStyle = info.fillColor || DEFAULT_FILL_COLOR;
    context.globalAlpha = Number.isFinite(info.fillOpacity) ? info.fillOpacity : DEFAULT_FILL_OPACITY;
    info.fillItems.forEach(item => {
      const visible = kind === 'sido' ? info.fillVisible : item.visible;
      if (!visible) return;
      item.canvasPolygons.forEach(polygonPaths => {
        drawFillPolygonPaths(context, polygonPaths, projection);
      });
    });
    context.restore();
  });
}

function drawLinePath(context, path, projection) {
  context.beginPath();
  let hasPoints = false;
  path.forEach(coord => {
    const point = projection.fromCoordToOffset(coord);
    if (!point || !Number.isFinite(point.x) || !Number.isFinite(point.y)) return;
    if (!hasPoints) context.moveTo(point.x, point.y);
    else context.lineTo(point.x, point.y);
    hasPoints = true;
  });
  if (hasPoints) context.stroke();
}

function drawVisibleLineCanvas(context, projection) {
  Object.keys(lineLayers).forEach(kind => {
    const info = lineLayers[kind];
    if (!info.loaded || !info.visible || !info.canvasLinePaths.length) return;
    const baseStyle = kind === 'sido' ? STYLE_SIDO : STYLE_SIGUNGU;
    context.save();
    context.strokeStyle = info.color || DEFAULT_LINE_COLOR;
    context.lineWidth = info.weight || DEFAULT_LINE_WEIGHT;
    context.globalAlpha = baseStyle.strokeOpacity;
    context.lineCap = 'round';
    context.lineJoin = 'round';
    info.canvasLinePaths.forEach(path => drawLinePath(context, path, projection));
    context.restore();
  });
}

function prepareBoundaryCanvas(canvas, width, height, pixelRatio) {
  const canvasWidth = Math.round(width * pixelRatio);
  const canvasHeight = Math.round(height * pixelRatio);
  if (canvas.width !== canvasWidth || canvas.height !== canvasHeight) {
    canvas.width = canvasWidth;
    canvas.height = canvasHeight;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
  }
  const context = canvas.getContext('2d');
  context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
  context.clearRect(0, 0, width, height);
  context.globalCompositeOperation = 'source-over';
  return context;
}

function FillCanvasOverlay(options = {}) {
  this._canvas = document.createElement('canvas');
  this._canvas.className = 'fill-blend-canvas';
  this._canvas.setAttribute('aria-hidden', 'true');
  this._lineCanvas = document.createElement('canvas');
  this._lineCanvas.className = 'line-overlay-canvas';
  this._lineCanvas.setAttribute('aria-hidden', 'true');
  this._blendMode = options.blendMode || DEFAULT_FILL_BLEND_MODE;
  this.setMap(options.map || null);
}

FillCanvasOverlay.prototype = new naver.maps.OverlayView();
FillCanvasOverlay.prototype.constructor = FillCanvasOverlay;

FillCanvasOverlay.prototype.onAdd = function() {
  const mapElement = document.getElementById('map');
  if (!mapElement) return;
  mapElement.append(this._canvas, this._lineCanvas);
  this.setBlendMode(this._blendMode);
};

FillCanvasOverlay.prototype.draw = function() {
  if (!this.getMap() || !this._canvas.isConnected || !this._lineCanvas.isConnected) return;
  const mapElement = document.getElementById('map');
  if (!mapElement) return;
  const width = mapElement.clientWidth;
  const height = mapElement.clientHeight;
  if (!width || !height) return;

  const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  const projection = this.getProjection();
  const fillContext = prepareBoundaryCanvas(this._canvas, width, height, pixelRatio);
  const lineContext = prepareBoundaryCanvas(this._lineCanvas, width, height, pixelRatio);
  drawVisibleFillCanvas(fillContext, projection);
  drawVisibleLineCanvas(lineContext, projection);
};

FillCanvasOverlay.prototype.onRemove = function() {
  this._canvas.remove();
  this._lineCanvas.remove();
};

FillCanvasOverlay.prototype.setBlendMode = function(mode) {
  this._blendMode = FILL_BLEND_MODE_STYLES[mode] ? mode : DEFAULT_FILL_BLEND_MODE;
  this._canvas.dataset.blendMode = this._blendMode;
  this._canvas.style.mixBlendMode = resolveFillBlendStyle(this._blendMode);
};

FillCanvasOverlay.prototype.requestDraw = function() {
  this.draw();
};

function ensureFillCanvasOverlay() {
  if (!fillCanvasOverlay) {
    fillCanvasOverlay = new FillCanvasOverlay({ map, blendMode: currentFillBlendMode });
    return fillCanvasOverlay;
  }
  if (fillCanvasOverlay.getMap() !== map) {
    fillCanvasOverlay.setMap(map);
  }
  fillCanvasOverlay.setBlendMode(currentFillBlendMode);
  return fillCanvasOverlay;
}

function requestFillCanvasRedraw() {
  fillCanvasOverlay?.requestDraw();
}

function setFillBlendMode(mode) {
  currentFillBlendMode = FILL_BLEND_MODE_STYLES[mode] ? mode : DEFAULT_FILL_BLEND_MODE;
  ensureFillCanvasOverlay().setBlendMode(currentFillBlendMode);
  requestFillCanvasRedraw();
}

// Polyline 생성 유틸
function makePolyline(path, style) {
  return new naver.maps.Polyline({
    map: null,
    path,
    strokeColor: style.strokeColor,
    strokeWeight: style.strokeWeight,
    strokeOpacity: style.strokeOpacity,
    clickable: false,
    zIndex: 1000
  });
}

function makeFillPolygon(polygonCoords, style) {
  return new naver.maps.Polygon({
    map: null,
    paths: polygonCoords.map(ringToPath),
    fillColor: style.fillColor,
    fillOpacity: style.fillOpacity,
    strokeColor: 'transparent',
    strokeOpacity: 0,
    strokeWeight: 0,
    clickable: false,
    zIndex: 900
  });
}

function updatePolylineColor(polyline, color) {
  if (typeof polyline.setOptions === 'function') {
    polyline.setOptions({ strokeColor: color });
    return;
  }
  if (typeof polyline.set === 'function') {
    polyline.set('strokeColor', color);
  }
}

function setLayerColor(kind, color, shouldRedraw = true) {
  const info = lineLayers[kind];
  if (!info) return;
  info.color = color || DEFAULT_LINE_COLOR;
  info.overlays.forEach(polyline => updatePolylineColor(polyline, info.color));
  if (shouldRedraw) requestFillCanvasRedraw();
}

function setAllLayerColors(color) {
  Object.keys(lineLayers).forEach(kind => setLayerColor(kind, color, false));
  requestFillCanvasRedraw();
}

function updateFillColor(polygon, color) {
  if (typeof polygon.setOptions === 'function') {
    polygon.setOptions({ fillColor: color });
    return;
  }
  if (typeof polygon.set === 'function') {
    polygon.set('fillColor', color);
  }
}

function setFillLayerColor(kind, color, shouldRedraw = true) {
  const info = lineLayers[kind];
  if (!info) return;
  info.fillColor = color || DEFAULT_FILL_COLOR;
  info.fillOverlays.forEach(polygon => updateFillColor(polygon, info.fillColor));
  if (shouldRedraw) requestFillCanvasRedraw();
}

function setAllFillColors(color) {
  Object.keys(lineLayers).forEach(kind => setFillLayerColor(kind, color, false));
  requestFillCanvasRedraw();
}

function updateFillOpacity(polygon, opacity) {
  if (typeof polygon.setOptions === 'function') {
    polygon.setOptions({
      fillOpacity: opacity,
      strokeColor: 'transparent',
      strokeOpacity: 0,
      strokeWeight: 0
    });
    return;
  }
  if (typeof polygon.set === 'function') {
    polygon.set('fillOpacity', opacity);
    polygon.set('strokeColor', 'transparent');
    polygon.set('strokeOpacity', 0);
    polygon.set('strokeWeight', 0);
  }
}

function setFillLayerOpacity(kind, opacity, shouldRedraw = true) {
  const info = lineLayers[kind];
  if (!info) return;
  const nextOpacity = Math.max(0, Math.min(1, Number(opacity)));
  info.fillOpacity = Number.isFinite(nextOpacity) ? nextOpacity : DEFAULT_FILL_OPACITY;
  info.fillOverlays.forEach(polygon => updateFillOpacity(polygon, info.fillOpacity));
  if (shouldRedraw) requestFillCanvasRedraw();
}

function setAllFillOpacities(opacity) {
  Object.keys(lineLayers).forEach(kind => setFillLayerOpacity(kind, opacity, false));
  requestFillCanvasRedraw();
}

function updatePolylineWeight(polyline, weight) {
  if (typeof polyline.setOptions === 'function') {
    polyline.setOptions({ strokeWeight: weight });
    return;
  }
  if (typeof polyline.set === 'function') {
    polyline.set('strokeWeight', weight);
  }
}

function setLayerWeight(kind, weight, shouldRedraw = true) {
  const info = lineLayers[kind];
  if (!info) return;
  const nextWeight = Number(weight) || DEFAULT_LINE_WEIGHT;
  info.weight = nextWeight;
  info.overlays.forEach(polyline => updatePolylineWeight(polyline, nextWeight));
  if (shouldRedraw) requestFillCanvasRedraw();
}

function setAllLayerWeights(weight) {
  Object.keys(lineLayers).forEach(kind => setLayerWeight(kind, weight, false));
  requestFillCanvasRedraw();
}

// GeoJSON Polygon 구조에서 Polyline 생성하여 버킷에 추가
function addPolylinesFromPolygon(polygonCoords, style, bucket, canvasPathBucket = null) {
  polygonCoords.forEach(ring => {
    const path = ringToPath(ring);
    const pl = makePolyline(path, style);
    bucket.push(pl);
    canvasPathBucket?.push(path);
  });
}

// GeoJSON MultiPolygon 구조에서 Polyline 생성하여 버킷에 추가
function addPolylinesFromMultiPolygon(multiCoords, style, bucket, canvasPathBucket = null) {
  multiCoords.forEach(poly => addPolylinesFromPolygon(poly, style, bucket, canvasPathBucket));
}

function addFillPolygonsFromPolygon(polygonCoords, style, bucket) {
  bucket.push(makeFillPolygon(polygonCoords, style));
}

function addFillPolygonsFromMultiPolygon(multiCoords, style, bucket) {
  multiCoords.forEach(poly => addFillPolygonsFromPolygon(poly, style, bucket));
}

function getGeoFeatures(geo) {
  return (geo.type === 'FeatureCollection')
    ? geo.features
    : (geo.type === 'Feature'
      ? [geo]
      : [{ type: 'Feature', geometry: geo }]);
}

async function getBoundaryGeoJSON(kind) {
  const info = lineLayers[kind];
  if (info.geo) return info.geo;
  if (info.loadPromise) return info.loadPromise;

  info.loadPromise = (async () => {
    const res = await fetch(info.url, { cache: 'no-cache' });
    if (!res.ok) throw new Error('GeoJSON 로드 실패: ' + info.url);
    const raw = await res.json();
    let geo;
    if (raw && raw.type === 'Topology') {
      const topologyObject = raw.objects.collection || Object.values(raw.objects)[0];
      geo = topojson.feature(raw, topologyObject);
    } else {
      geo = raw;
    }
    info.geo = geo;
    return geo;
  })();

  try {
    return await info.loadPromise;
  } catch (err) {
    info.loadPromise = null;
    throw err;
  }
}

// 지정된 종류(k: 'sido'|'sigungu')의 GeoJSON을 최초 1회만 불러와서 Polyline 생성
async function loadGeoJSONOnce(kind) {
  const info = lineLayers[kind];
  if (info.loaded) return;
  const geo = await getBoundaryGeoJSON(kind);
  const bucket = info.overlays;
  const baseStyle = (kind === 'sido') ? STYLE_SIDO : STYLE_SIGUNGU;
  const style = Object.assign({}, baseStyle, {
    strokeColor: info.color || DEFAULT_LINE_COLOR,
    strokeWeight: info.weight || DEFAULT_LINE_WEIGHT
  });
  const features = getGeoFeatures(geo);
  features.forEach(f => {
    if (!f || !f.geometry) return;
    const g = f.geometry;
    if (g.type === 'Polygon') {
      addPolylinesFromPolygon(g.coordinates, style, bucket, info.canvasLinePaths);
    } else if (g.type === 'MultiPolygon') {
      addPolylinesFromMultiPolygon(g.coordinates, style, bucket, info.canvasLinePaths);
    }
  });
  info.loaded = true;
  requestFillCanvasRedraw();
}

async function loadFillGeoJSONOnce(kind) {
  const info = lineLayers[kind];
  if (info.fillLoaded) return;
  const geo = await getBoundaryGeoJSON(kind);
  const style = Object.assign({}, STYLE_FILL, {
    fillColor: info.fillColor || DEFAULT_FILL_COLOR,
    fillOpacity: Number.isFinite(info.fillOpacity) ? info.fillOpacity : DEFAULT_FILL_OPACITY
  });
  info.fillItems = [];
  getGeoFeatures(geo).forEach((f, index) => {
    if (!f || !f.geometry) return;
    const featureOverlays = [];
    const canvasPolygons = [];
    const g = f.geometry;
    if (g.type === 'Polygon') {
      addFillPolygonsFromPolygon(g.coordinates, style, featureOverlays);
      canvasPolygons.push(g.coordinates.map(ringToPath));
    } else if (g.type === 'MultiPolygon') {
      addFillPolygonsFromMultiPolygon(g.coordinates, style, featureOverlays);
      g.coordinates.forEach(polygonCoords => {
        canvasPolygons.push(polygonCoords.map(ringToPath));
      });
    }
    if (!canvasPolygons.length) return;
    const properties = f.properties || {};
    const name = properties.name || properties.SIG_KOR_NM || properties.CTP_KOR_NM || ('지역 ' + (index + 1));
    const id = String(properties.code || properties.SIG_CD || properties.CTPRVN_CD || (kind + '_' + index));
    info.fillItems.push({ id, name, overlays: featureOverlays, canvasPolygons, visible: false });
    info.fillOverlays.push(...featureOverlays);
  });
  info.fillLoaded = true;
}

// 현재 visible 상태에 따라 지도에 오버레이를 적용/제거
function applyVisibility(kind) {
  const { overlays } = lineLayers[kind];
  overlays.forEach(pl => pl.setMap(null));
  requestFillCanvasRedraw();
}

function applyFillVisibility(kind) {
  const info = lineLayers[kind];
  if (!info) return;
  info.fillOverlays.forEach(polygon => polygon.setMap(null));
  requestFillCanvasRedraw();
}

function applyFillFeatureVisibility(kind, itemIndex) {
  const info = lineLayers[kind];
  const item = info?.fillItems[itemIndex];
  if (!item) return;
  item.overlays.forEach(polygon => polygon.setMap(null));
  requestFillCanvasRedraw();
}

function setAllFillFeatureVisibility(kind, visible) {
  const info = lineLayers[kind];
  if (!info) return;
  info.fillItems.forEach(item => {
    item.visible = visible;
  });
  applyFillVisibility(kind);
}

// 새 map 생성 후 기존 오버레이와 검색 핀을 복원하는 함수
function restoreAllOverlaysOnNewMap() {
  Object.keys(lineLayers).forEach(k => {
    lineLayers[k].overlays.forEach(pl => pl.setMap(null));
    lineLayers[k].fillOverlays.forEach(polygon => polygon.setMap(null));
  });
  ensureFillCanvasOverlay();
  requestFillCanvasRedraw();
  searchMarkers.forEach(entry => entry.marker.setMap(searchMarkersVisible ? map : null));
}

function getSearchMarkerKey(item) {
  return [Number(item.lat).toFixed(6), Number(item.lng).toFixed(6)].join(',');
}

function isSearchMarkerAdded(item) {
  const key = getSearchMarkerKey(item);
  return searchMarkers.some(entry => entry.key === key);
}

function getUniqueSearchMarkerColor() {
  const available = SEARCH_MARKER_COLORS.filter(color => !usedSearchMarkerColors.has(color));
  let color;
  if (available.length) {
    color = available[Math.floor(Math.random() * available.length)];
  } else {
    do {
      color = 'hsl(' + Math.floor(Math.random() * 360) + ' 76% 47%)';
    } while (usedSearchMarkerColors.has(color));
  }
  usedSearchMarkerColors.add(color);
  return color;
}

function removeSearchMarker(key) {
  const index = searchMarkers.findIndex(entry => entry.key === key);
  if (index === -1) return false;

  const [entry] = searchMarkers.splice(index, 1);
  entry.marker.setMap(null);
  if (entry.rightClickListener) {
    naver.maps.Event.removeListener(entry.rightClickListener);
  }
  usedSearchMarkerColors.delete(entry.color);
  if (!searchMarkers.length) searchMarkersVisible = true;
  rightClickInfoWindow?.close();
  updateAddressMarkerToggle();
  updateSearchResultAddButtons();
  return true;
}

function addSearchMarker(item) {
  const key = getSearchMarkerKey(item);
  if (searchMarkers.some(entry => entry.key === key)) return false;

  const latlng = new naver.maps.LatLng(item.lat, item.lng);
  const color = getUniqueSearchMarkerColor();
  const marker = new naver.maps.Marker({
    position: latlng,
    map,
    zIndex:2000 + searchMarkers.length,
    title:String(item.title || '검색 위치') + ' — 우클릭하여 핀 삭제',
    icon:{
      content:'<span class="search-map-pin" style="--pin-color:' + color + '"></span>',
      anchor:new naver.maps.Point(15, 38)
    }
  });

  const entry = { key, marker, color, latlng, rightClickListener:null };
  entry.rightClickListener = naver.maps.Event.addListener(marker, 'rightclick', (event) => {
    event?.domEvent?.preventDefault?.();
    event?.domEvent?.stopPropagation?.();
    removeSearchMarker(key);
  });
  searchMarkers.push(entry);
  searchMarkersVisible = true;
  searchMarkers.forEach(entry => entry.marker.setMap(map));
  updateAddressMarkerToggle();
  return true;
}

function updateAddressMarkerToggle() {
  const button = document.getElementById('toggleAddressMarker');
  if (!button) return;
  const count = searchMarkers.length;
  button.disabled = count === 0;
  button.textContent = (searchMarkersVisible ? '핀 숨김' : '핀 표시') + ' (' + count + ')';
  button.setAttribute('aria-label', (searchMarkersVisible ? '검색 핀 모두 숨기기' : '검색 핀 모두 표시하기') + ', 현재 ' + count + '개');
}

function hideSearchResults() {
  document.getElementById('searchResults')?.classList.remove('is-open');
}

function setSearchHistoryOpen(open) {
  const panel = document.getElementById('searchHistory');
  const button = document.getElementById('toggleSearchHistory');
  if (!panel || !button) return;
  panel.classList.toggle('is-open', open);
  button.setAttribute('aria-expanded', String(open));
  button.setAttribute('aria-label', open ? '과거 검색목록 닫기' : '과거 검색목록 열기');
  if (open) hideSearchResults();
}

function loadSearchHistory() {
  try {
    const stored = JSON.parse(localStorage.getItem(SEARCH_HISTORY_STORAGE_KEY) || '[]');
    searchHistoryQueries = Array.isArray(stored)
      ? stored.filter(query => typeof query === 'string' && query.trim()).slice(0, MAX_SEARCH_HISTORY)
      : [];
  } catch (err) {
    searchHistoryQueries = [];
  }
}

function saveSearchHistory() {
  try {
    localStorage.setItem(SEARCH_HISTORY_STORAGE_KEY, JSON.stringify(searchHistoryQueries));
  } catch (err) {
    console.warn('Search history could not be saved', err);
  }
}

function renderSearchHistory() {
  const list = document.getElementById('searchHistoryList');
  if (!list) return;
  if (!searchHistoryQueries.length) {
    list.innerHTML = '<div class="search-empty">저장된 검색어가 없습니다.</div>';
    return;
  }
  list.innerHTML = searchHistoryQueries.map((query, index) => (
    '<button class="search-history-item" type="button" data-history-index="' + index + '">' +
    escapeHtml(query) +
    '</button>'
  )).join('');
  list.querySelectorAll('.search-history-item').forEach(button => {
    button.addEventListener('click', () => {
      const query = searchHistoryQueries[Number(button.dataset.historyIndex)];
      const input = document.getElementById('addressInput');
      if (!query || !input) return;
      input.value = query;
      rememberSearchQuery(query);
      setSearchHistoryOpen(false);
      moveToAddress(query);
    });
  });
}

function rememberSearchQuery(query) {
  const normalized = String(query || '').trim();
  if (!normalized) return;
  searchHistoryQueries = [
    normalized,
    ...searchHistoryQueries.filter(saved => saved.toLocaleLowerCase() !== normalized.toLocaleLowerCase())
  ].slice(0, MAX_SEARCH_HISTORY);
  saveSearchHistory();
  renderSearchHistory();
}

function bindSearchHistory() {
  const form = document.getElementById('addressSearch');
  const button = document.getElementById('toggleSearchHistory');
  const panel = document.getElementById('searchHistory');
  const clearButton = document.getElementById('clearSearchHistory');
  if (!form || !button || !panel || !clearButton) return;

  loadSearchHistory();
  renderSearchHistory();
  button.addEventListener('click', e => {
    e.stopPropagation();
    setSearchHistoryOpen(!panel.classList.contains('is-open'));
  });
  panel.addEventListener('click', e => e.stopPropagation());
  clearButton.addEventListener('click', () => {
    searchHistoryQueries = [];
    saveSearchHistory();
    renderSearchHistory();
  });
  document.addEventListener('click', e => {
    if (!form.contains(e.target)) setSearchHistoryOpen(false);
  });
}

function bindAddressMarkerToggle() {
  const button = document.getElementById('toggleAddressMarker');
  button?.addEventListener('click', () => {
    hideSearchResults();
    if (!searchMarkers.length) return;
    searchMarkersVisible = !searchMarkersVisible;
    searchMarkers.forEach(entry => entry.marker.setMap(searchMarkersVisible ? map : null));
    if (!searchMarkersVisible) rightClickInfoWindow?.close();
    updateAddressMarkerToggle();
  });
  updateAddressMarkerToggle();
}

function showSearchStatus(message) {
  const results = document.getElementById('searchResults');
  if (!results) return;
  setSearchHistoryOpen(false);
  results.innerHTML = '<div class="search-empty">' + escapeHtml(message) + '</div>';
  results.classList.add('is-open');
}

function geocodeNaver(query) {
  return new Promise(resolve => {
    if (!window.naver || !naver.maps || !naver.maps.Service || !naver.maps.Service.geocode) {
      resolve([]);
      return;
    }
    naver.maps.Service.geocode({ query }, (status, response) => {
      if (status !== naver.maps.Service.Status.OK) {
        resolve([]);
        return;
      }
      const addresses = response?.v2?.addresses || [];
      resolve(addresses.map((item, index) => ({
        title: item.roadAddress || item.jibunAddress || query,
        address: item.roadAddress || item.jibunAddress || item.englishAddress || '',
        lat: Number(item.y),
        lng: Number(item.x),
        source: index === 0 ? 'Naver address' : 'Naver candidate'
      })).filter(item => Number.isFinite(item.lat) && Number.isFinite(item.lng)));
    });
  });
}

async function searchOpenStreetMap(query) {
  const params = new URLSearchParams({
    q: query,
    format: 'jsonv2',
    addressdetails: '1',
    limit: '8',
    countrycodes: 'kr',
    'accept-language': 'ko'
  });
  try {
    const response = await fetch('https://nominatim.openstreetmap.org/search?' + params.toString(), {
      headers: { Accept: 'application/json' }
    });
    if (!response.ok) return [];
    const places = await response.json();
    return places.map(place => ({
      title: place.name || place.display_name?.split(',')[0] || query,
      address: place.display_name || '',
      lat: Number(place.lat),
      lng: Number(place.lon),
      source: place.type || place.class || 'POI'
    })).filter(item => Number.isFinite(item.lat) && Number.isFinite(item.lng));
  } catch (err) {
    console.warn('POI search failed', err);
    return [];
  }
}

function dedupeSearchResults(items) {
  const seen = new Set();
  return items.filter(item => {
    const key = [item.title, item.address, item.lat.toFixed(5), item.lng.toFixed(5)].join('|');
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  }).slice(0, 10);
}

function updateSearchResultAddButtons() {
  document.querySelectorAll('.search-result-add').forEach(button => {
    const item = activeSearchResults[Number(button.dataset.addIndex)];
    const added = item && isSearchMarkerAdded(item);
    button.disabled = Boolean(added);
    button.textContent = added ? '추가됨' : '추가';
  });
}

function renderSearchResults(results) {
  const list = document.getElementById('searchResults');
  if (!list) return;
  setSearchHistoryOpen(false);
  activeSearchResults = results;
  if (!results.length) {
    showSearchStatus('검색 결과가 없습니다. 다른 상호, 키워드, 주소로 검색해보세요.');
    return;
  }
  list.innerHTML = results.map((item, index) => {
    const added = isSearchMarkerAdded(item);
    return '<div class="search-result" data-index="' + index + '">' +
      '<button class="search-result-main" type="button" data-index="' + index + '">' +
      '<strong>' + escapeHtml(item.title || '검색 결과') + '</strong>' +
      '<span>' + escapeHtml(item.address || item.source || '') + '</span>' +
      '</button>' +
      '<button class="search-result-add" type="button" data-add-index="' + index + '" aria-label="이 위치 핀 추가"' + (added ? ' disabled' : '') + '>' +
      (added ? '추가됨' : '추가') +
      '</button>' +
      '</div>';
  }).join('');
  list.classList.add('is-open');
  list.querySelectorAll('.search-result-main').forEach(button => {
    button.addEventListener('click', () => selectSearchResult(Number(button.dataset.index)));
  });
  list.querySelectorAll('.search-result-add').forEach(button => {
    button.addEventListener('click', () => {
      const index = Number(button.dataset.addIndex);
      const item = activeSearchResults[index];
      if (!item) return;
      addSearchMarker(item);
      selectSearchResult(index);
      updateSearchResultAddButtons();
    });
  });
}

function selectSearchResult(index) {
  const item = activeSearchResults[index];
  if (!item) return;
  document.querySelectorAll('.search-result').forEach((row, rowIndex) => {
    row.classList.toggle('is-selected', rowIndex === index);
  });
  rightClickInfoWindow?.close();
  const latlng = new naver.maps.LatLng(item.lat, item.lng);
  map.morph(latlng, 17);
}

async function moveToAddress(query) {
  rightClickInfoWindow?.close();
  showSearchStatus('검색 중...');
  const [naverResults, poiResults] = await Promise.all([
    geocodeNaver(query),
    searchOpenStreetMap(query)
  ]);
  const results = dedupeSearchResults([...naverResults, ...poiResults]);
  renderSearchResults(results);
  if (results.length === 1) selectSearchResult(0);
}

function bindAddressSearch() {
  const form = document.getElementById('addressSearch');
  const input = document.getElementById('addressInput');
  form?.addEventListener('submit', (e) => {
    e.preventDefault();
    const query = input.value.trim();
    if (!query) {
      input.focus();
      return;
    }
    rememberSearchQuery(query);
    moveToAddress(query);
  });
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[ch]));
}

function getReverseAddress(response) {
  const address = response?.v2?.address;
  if (address?.roadAddress) return address.roadAddress;
  if (address?.jibunAddress) return address.jibunAddress;
  const result = response?.v2?.results?.[0];
  if (!result) return '';
  const region = result.region || {};
  return [region.area1, region.area2, region.area3, region.area4]
    .map(area => area?.name)
    .filter(Boolean)
    .join(' ');
}

function showRightClickInfo(latlng, content) {
  if (!rightClickInfoWindow) {
    rightClickInfoWindow = new naver.maps.InfoWindow({
      borderWidth: 0,
      disableAnchor: false,
      backgroundColor: 'transparent',
      pixelOffset: new naver.maps.Point(0, -8)
    });
  }
  rightClickInfoWindow.setContent(

function lookupRightClickAddress(latlng) {
  showRightClickInfo(latlng, '주소 확인 중...');
  if (!window.naver || !naver.maps || !naver.maps.Service || !naver.maps.Service.reverseGeocode) {
    showRightClickInfo(latlng, '주소 확인 기능을 불러오지 못했습니다.');
    return;
  }
  naver.maps.Service.reverseGeocode({
    coords: latlng,
    orders: [
      naver.maps.Service.OrderType.ROAD_ADDR,
      naver.maps.Service.OrderType.ADDR
    ].join(',')
  }, (status, response) => {
    if (status !== naver.maps.Service.Status.OK) {
      showRightClickInfo(latlng, '주소를 찾지 못했습니다.');
      return;
    }
    const address = getReverseAddress(response);
    showRightClickInfo(latlng, address ? escapeHtml(address) : '주소를 찾지 못했습니다.');
  });
}

function bindMapRightClick() {
  naver.maps.Event.addListener(map, 'rightclick', (e) => {
    lookupRightClickAddress(e.coord);
  });
  naver.maps.Event.addListener(map, 'click', () => {
    rightClickInfoWindow?.close();
  });
}

function positionFloatingPanel(panel, anchor) {
  const anchorRect = anchor.getBoundingClientRect();
  const wrapRect = document.querySelector('.buttons').getBoundingClientRect();
  const panelWidth = panel.offsetWidth || 48;
  const desiredLeft = anchorRect.left - wrapRect.left + (anchorRect.width - panelWidth) / 2;
  const maxLeft = Math.max(0, window.innerWidth - wrapRect.left - panelWidth - 12);
  panel.style.left = Math.max(0, Math.min(desiredLeft, maxLeft)) + 'px';
  panel.style.top = (anchorRect.bottom - wrapRect.top + 6) + 'px';
}

function renderFillRegionPanel(kind) {
  const panel = document.getElementById('FILL_REGION_PANEL');
  const trigger = document.getElementById('FILL_DROPDOWN_' + kind.toUpperCase());
  if (!panel || !trigger) return;
  panel.replaceChildren();

  const header = document.createElement('div');
  header.className = 'fill-region-panel-header';
  header.textContent = trigger.dataset.fillLabel + ' 지역별 채움';
  panel.appendChild(header);

  const options = document.createElement('div');
  options.className = 'fill-region-options';
  const fillItems = lineLayers[kind].fillItems;

  const allLabel = document.createElement('label');
  allLabel.className = 'fill-region-option fill-region-option-all';
  const allCheckbox = document.createElement('input');
  allCheckbox.type = 'checkbox';
  allCheckbox.dataset.fillAll = kind;
  allCheckbox.setAttribute('aria-label', trigger.dataset.fillLabel + ' 전체 채움');
  const allName = document.createElement('span');
  allName.textContent = '전체';
  allLabel.append(allCheckbox, allName);
  options.appendChild(allLabel);

  const syncAllCheckbox = () => {
    const selectedCount = fillItems.filter(item => item.visible).length;
    allCheckbox.checked = fillItems.length > 0 && selectedCount === fillItems.length;
    allCheckbox.indeterminate = selectedCount > 0 && selectedCount < fillItems.length;
  };

  allCheckbox.addEventListener('change', () => {
    setAllFillFeatureVisibility(kind, allCheckbox.checked);
    options.querySelectorAll('input[data-fill-index]').forEach(checkbox => {
      checkbox.checked = allCheckbox.checked;
    });
    syncAllCheckbox();
    updateFillRegionTrigger(kind);
  });

  fillItems.forEach((item, itemIndex) => {
    const label = document.createElement('label');
    label.className = 'fill-region-option';

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = item.visible;
    checkbox.dataset.fillKind = kind;
    checkbox.dataset.fillIndex = String(itemIndex);
    checkbox.setAttribute('aria-label', item.name + ' 채움');
    checkbox.addEventListener('change', () => {
      item.visible = checkbox.checked;
      applyFillFeatureVisibility(kind, itemIndex);
      syncAllCheckbox();
      updateFillRegionTrigger(kind);
    });

    const name = document.createElement('span');
    name.textContent = item.name;
    label.append(checkbox, name);
    options.appendChild(label);
  });
  syncAllCheckbox();
  panel.appendChild(options);
}

function bindFillRegionDropdownHandlers() {
  const panel = document.getElementById('FILL_REGION_PANEL');
  if (!panel) return;

  document.querySelectorAll('.fill-region-trigger').forEach(trigger => {
    const kind = trigger.dataset.fillKind;
    updateFillRegionTrigger(kind);
    trigger.addEventListener('click', async (e) => {
      e.stopPropagation();
      const isCurrentOpen = panel.classList.contains('is-open') && activeFillRegionKind === kind;
      if (isCurrentOpen) {
        closeControlPanels();
        return;
      }

      closeControlPanels('FILL_REGION_PANEL');
      document.querySelectorAll('.fill-region-trigger').forEach(button => {
        button.setAttribute('aria-expanded', 'false');
      });
      activeFillRegionKind = kind;
      trigger.setAttribute('aria-expanded', 'true');
      panel.classList.add('is-open');
      panel.innerHTML = '<div class="fill-region-loading">지역 목록을 불러오는 중…</div>';
      positionFloatingPanel(panel, trigger);

      try {
        await loadFillGeoJSONOnce(kind);
        if (activeFillRegionKind !== kind || !panel.classList.contains('is-open')) return;
        renderFillRegionPanel(kind);
        positionFloatingPanel(panel, trigger);
      } catch (err) {
        console.error(err);
        if (activeFillRegionKind === kind) {
          panel.innerHTML = '<div class="fill-region-error">지역 목록을 불러오지 못했습니다.</div>';
          positionFloatingPanel(panel, trigger);
        }
      }
    });
  });

  panel.addEventListener('click', e => e.stopPropagation());
  window.addEventListener('resize', () => {
    if (!panel.classList.contains('is-open') || !activeFillRegionKind) return;
    const trigger = document.getElementById('FILL_DROPDOWN_' + activeFillRegionKind.toUpperCase());
    if (trigger) positionFloatingPanel(panel, trigger);
  });
}

const NAVER_STATIC_MAP_ENDPOINT = 'https://maps.apigw.ntruss.com/map-static/v2/raster-cors';
const NAVER_STATIC_MAP_TILE_LIMIT = 1024;
const NAVER_STATIC_MAP_KEY_ID = (() => {
  const script = document.querySelector('script[src*="oapi.map.naver.com/openapi/v3/maps.js"]');
  if (!script) return 'htcml1d5g3';

function canvasToPngBlob(canvas){
  return new Promise((resolve, reject) => {
    canvas.toBlob(blob => {
      if (blob) resolve(blob);
      else reject(new Error('PNG 이미지를 만들지 못했습니다.'));
    }, 'image/png');
  });
}

function getStaticMapTypeForExport(){
  const selection = document.getElementById('THEME_SELECT')?.value;
  if (selection === 'SATELLITE') return 'satellite_base';
  if (selection === 'HYBRID') return 'satellite';
  if (selection === 'TERRAIN') return 'terrain';
  return 'basic';
}

function getMapExportScale(){
  return (window.devicePixelRatio || 1) > 1 ? 2 : 1;
}

function buildStaticMapTileUrl(tile, scale){
  const projection = map?.getProjection?.();
  if (!projection) throw new Error('지도 투영 정보를 불러오지 못했습니다.');
  const centerOffset = new naver.maps.Point(
    tile.x + tile.width / 2,
    tile.y + tile.height / 2
  );
  const center = projection.fromOffsetToCoord(centerOffset);
  if (!center) throw new Error('지도 중심 좌표를 계산하지 못했습니다.');

  const params = new URLSearchParams({
    w:String(tile.width),
    h:String(tile.height),
    center:center.lng() + ',' + center.lat(),
    level:String(Math.round(map.getZoom())),
    maptype:getStaticMapTypeForExport(),
    format:'png',
    scale:String(scale),
    lang:'ko',
    'X-NCP-APIGW-API-KEY-ID':NAVER_STATIC_MAP_KEY_ID
  });
  return NAVER_STATIC_MAP_ENDPOINT + '?' + params.toString();
}

function loadBlobImage(blob){
  return new Promise((resolve, reject) => {
    const source = URL.createObjectURL(blob);
    const image = new Image();
    image.onload = () => {
      URL.revokeObjectURL(source);
      resolve(image);
    };
    image.onerror = () => {
      URL.revokeObjectURL(source);
      reject(new Error('정적 지도 이미지를 읽지 못했습니다.'));
    };
    image.src = source;
  });
}

async function fetchStaticMapTile(tile, scale){
  const response = await fetch(buildStaticMapTileUrl(tile, scale), {
    mode:'cors',
    credentials:'omit',
    referrer:location.origin + location.pathname,
    referrerPolicy:'unsafe-url'
  });
  if (!response.ok) {
    throw new Error('정적 지도 요청에 실패했습니다. (' + response.status + ')');
  }
  return loadBlobImage(await response.blob());
}

async function drawStaticMapBackground(context, width, height, scale){
  const tiles = [];
  for (let y = 0; y < height; y += NAVER_STATIC_MAP_TILE_LIMIT) {
    for (let x = 0; x < width; x += NAVER_STATIC_MAP_TILE_LIMIT) {
      tiles.push({
        x,
        y,
        width:Math.min(NAVER_STATIC_MAP_TILE_LIMIT, width - x),
        height:Math.min(NAVER_STATIC_MAP_TILE_LIMIT, height - y)
      });
    }
  }

  const loadedTiles = await Promise.all(tiles.map(async tile => ({
    tile,
    image:await fetchStaticMapTile(tile, scale)
  })));
  loadedTiles.forEach(({ tile, image }) => {
    context.drawImage(
      image,
      tile.x * scale,
      tile.y * scale,
      tile.width * scale,
      tile.height * scale
    );
  });
}

function getCanvasCompositeMode(){
  const mode = resolveFillBlendStyle(currentFillBlendMode);
  if (mode === 'normal') return 'source-over';
  if (mode === 'plus-lighter') return 'lighter';
  if (mode === 'plus-darker') return 'darken';
  return mode;
}

function drawExportPin(context, offset, color, scale){
  if (!offset || !Number.isFinite(offset.x) || !Number.isFinite(offset.y)) return;
  context.save();
  context.scale(scale, scale);
  context.translate(offset.x, offset.y);
  context.beginPath();
  context.moveTo(0, 0);
  context.bezierCurveTo(-3, -7, -12, -14, -12, -22);
  context.arc(0, -22, 12, Math.PI, Math.PI * 2);
  context.bezierCurveTo(12, -14, 3, -7, 0, 0);
  context.closePath();
  context.fillStyle = color;
  context.fill();
  context.lineWidth = 2;
  context.strokeStyle = '#fff';
  context.stroke();
  context.beginPath();
  context.arc(0, -22, 4, 0, Math.PI * 2);
  context.fillStyle = '#fff';
  context.fill();
  context.restore();
}

function drawCurrentMapOverlays(context, width, height, scale){
  fillCanvasOverlay?.requestDraw();
  const fillCanvas = document.querySelector('.fill-blend-canvas');
  const lineCanvas = document.querySelector('.line-overlay-canvas');

  if (fillCanvas instanceof HTMLCanvasElement) {
    context.save();
    const requestedMode = getCanvasCompositeMode();
    context.globalCompositeOperation = requestedMode;
    if (context.globalCompositeOperation !== requestedMode) {
      context.globalCompositeOperation = 'source-over';
    }
    context.drawImage(fillCanvas, 0, 0, width * scale, height * scale);
    context.restore();
  }
  if (lineCanvas instanceof HTMLCanvasElement) {
    context.drawImage(lineCanvas, 0, 0, width * scale, height * scale);
  }

  if (!searchMarkersVisible) return;
  const projection = map?.getProjection?.();
  if (!projection) return;
  searchMarkers.forEach(entry => {
    const offset = projection.fromCoordToOffset(entry.latlng);
    if (offset.x < -20 || offset.y < -40 || offset.x > width + 20 || offset.y > height + 20) return;
    drawExportPin(context, offset, entry.color, scale);
  });
}

async function exportCurrentMapAsPng(){
  const button = document.getElementById('EXPORT_MAP');
  const mapElement = document.getElementById('map');
  if (!button || !mapElement || !map) return;

  const width = Math.max(1, Math.round(mapElement.clientWidth));
  const height = Math.max(1, Math.round(mapElement.clientHeight));
  const scale = getMapExportScale();
  const originalLabel = button.textContent;
  button.disabled = true;
  button.textContent = '저장 중...';

  try {
    const canvas = document.createElement('canvas');
    canvas.width = width * scale;
    canvas.height = height * scale;
    const context = canvas.getContext('2d');
    if (!context) throw new Error('이미지 캔버스를 만들지 못했습니다.');

    await drawStaticMapBackground(context, width, height, scale);
    drawCurrentMapOverlays(context, width, height, scale);

    const pngBlob = await canvasToPngBlob(canvas);
    const downloadUrl = URL.createObjectURL(pngBlob);
    const link = document.createElement('a');
    link.href = downloadUrl;
    link.download = getMapExportFilename();
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
  } catch (error) {
    console.error('Map PNG export failed', error);
    alert('지도 이미지 저장에 실패했습니다. 네트워크 연결 후 다시 시도해 주세요.');
  } finally {
    button.disabled = false;
    button.textContent = originalLabel;
  }
}

function waitForNextPaint(){
  return new Promise(resolve => {
    requestAnimationFrame(() => requestAnimationFrame(resolve));
  });
}

function waitForCapturedFrame(video){
  if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) return Promise.resolve();
  return new Promise((resolve, reject) => {
    video.addEventListener('loadeddata', resolve, { once:true });
    video.addEventListener('error', () => reject(new Error('캡처 화면을 읽지 못했습니다.')), { once:true });
  });
}

function drawCapturedMapFrame(video, mapElement){
  const rect = mapElement.getBoundingClientRect();
  const scaleX = video.videoWidth / window.innerWidth;
  const scaleY = video.videoHeight / window.innerHeight;
  if (!rect.width || !rect.height || scaleX <= 0 || scaleY <= 0 || !Number.isFinite(scaleX) || !Number.isFinite(scaleY)) {
    throw new Error('캡처 화면 크기를 계산하지 못했습니다.');
  }

  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(rect.width * scaleX));
  canvas.height = Math.max(1, Math.round(rect.height * scaleY));
  const context = canvas.getContext('2d');
  if (!context) throw new Error('PNG 이미지를 만들지 못했습니다.');
  context.drawImage(
    video,
    rect.left * scaleX,
    rect.top * scaleY,
    rect.width * scaleX,
    rect.height * scaleY,
    0,
    0,
    canvas.width,
    canvas.height
  );
  return canvas;
}

async function captureVisibleMapAsPng(){
  const button = document.getElementById('EXPORT_MAP');
  const mapElement = document.getElementById('map');
  if (!button || !mapElement || !map) return;

  const originalLabel = button.textContent;
  let captureStream = null;
  button.disabled = true;
  button.textContent = '현재 탭 선택';

  try {
    if (!navigator.mediaDevices?.getDisplayMedia) {
      throw new Error('SCREEN_CAPTURE_UNSUPPORTED');
    }
    closeControlPanels();
    hideSearchResults();
    setSearchHistoryOpen(false);
    rightClickInfoWindow?.close();
    document.body.classList.add('exporting-map');
    fillCanvasOverlay?.requestDraw();

    captureStream = await navigator.mediaDevices.getDisplayMedia({
      video:{ displaySurface:'browser' },
      audio:false,
      preferCurrentTab:true,
      selfBrowserSurface:'include',
      surfaceSwitching:'exclude'
    });
    const track = captureStream.getVideoTracks()[0];
    const displaySurface = track?.getSettings?.().displaySurface;
    if (displaySurface && displaySurface !== 'browser') {
      throw new Error('CURRENT_TAB_REQUIRED');
    }

    const video = document.createElement('video');
    video.muted = true;
    video.playsInline = true;
    video.srcObject = captureStream;
    await video.play();
    await waitForCapturedFrame(video);
    await waitForNextPaint();

    const canvas = drawCapturedMapFrame(video, mapElement);
    const pngBlob = await canvasToPngBlob(canvas);
    const downloadUrl = URL.createObjectURL(pngBlob);
    const link = document.createElement('a');
    link.href = downloadUrl;
    link.download = getMapExportFilename();
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
  } catch (error) {
    console.error('Map screen capture failed', error);
    if (error?.message === 'CURRENT_TAB_REQUIRED') {
      alert('브라우저 창이나 전체 화면이 아닌 "현재 탭"을 선택해 주세요.');
    } else if (error?.message === 'SCREEN_CAPTURE_UNSUPPORTED') {
      alert('이 브라우저는 현재 화면 PNG 저장을 지원하지 않습니다.');
    } else if (error?.name !== 'NotAllowedError') {
      alert('지도 이미지 저장에 실패했습니다. 다시 시도해 주세요.');
    }
  } finally {
    captureStream?.getTracks().forEach(track => track.stop());
    document.body.classList.remove('exporting-map');
    button.disabled = false;
    button.textContent = originalLabel;
  }
}

function waitForAnimationFrame(){
  return new Promise(resolve => requestAnimationFrame(resolve));
}

function hasVisibleMapPixels(context, width, height){
  const colors = new Set();
  for (let row = 1; row <= 5; row += 1) {
    for (let column = 1; column <= 7; column += 1) {
      const x = Math.min(width - 1, Math.max(0, Math.floor(width * column / 8)));
      const y = Math.min(height - 1, Math.max(0, Math.floor(height * row / 6)));
      const pixel = context.getImageData(x, y, 1, 1).data;
      if (pixel[3]) colors.add([pixel[0], pixel[1], pixel[2], pixel[3]].join(','));
      if (colors.size >= 2) return true;
    }
  }
  return false;
}

function getMapPixelSignature(context, width, height){
  return [
    [.18, .22],
    [.50, .22],
    [.82, .22],
    [.34, .70],
    [.68, .70]
  ].map(([xRatio, yRatio]) => {
    const x = Math.min(width - 1, Math.floor(width * xRatio));
    const y = Math.min(height - 1, Math.floor(height * yRatio));
    return Array.from(context.getImageData(x, y, 1, 1).data).join(',');
  }).join('|');
}

function drawMapAttribution(context, width, height, scale){
  const selection = document.getElementById('THEME_SELECT')?.value;
  const darkBackground = selection === 'DARK' || selection === 'BLUE' || selection === 'BLUENOSB';
  context.save();
  context.scale(scale, scale);
  context.font = '700 11px Arial, sans-serif';
  context.textBaseline = 'bottom';
  context.fillStyle = darkBackground ? 'rgba(255,255,255,.86)' : 'rgba(16,17,20,.74)';
  context.fillText('NAVER', 10, height - 9);
  context.font = '400 10px Arial, sans-serif';
  context.fillText('© NAVER Corp.', 54, height - 9);
  context.restore();
}

async function exportVisibleMapDirectly(){
  const button = document.getElementById('EXPORT_MAP');
  const mapElement = document.getElementById('map');
  if (!button || !mapElement || !map) return;

  const originalLabel = button.textContent;
  button.disabled = true;
  button.textContent = '저장 중...';
  button.dataset.exportStatus = 'running';
  delete button.dataset.exportSignature;

  try {
    closeControlPanels();
    hideSearchResults();
    setSearchHistoryOpen(false);
    rightClickInfoWindow?.close();
    fillCanvasOverlay?.requestDraw();
    map.refresh?.(true);
    await waitForAnimationFrame();

    const baseCanvas = mapElement.querySelector('canvas.mapboxgl-canvas');
    if (!(baseCanvas instanceof HTMLCanvasElement)) {
      throw new Error('DIRECT_MAP_CAPTURE_UNAVAILABLE');
    }
    const width = Math.max(1, Math.round(mapElement.clientWidth));
    const height = Math.max(1, Math.round(mapElement.clientHeight));
    const scale = getMapExportScale();
    const canvas = document.createElement('canvas');
    canvas.width = width * scale;
    canvas.height = height * scale;
    const context = canvas.getContext('2d');
    if (!context) throw new Error('PNG 이미지를 만들지 못했습니다.');

    context.drawImage(
      baseCanvas,
      0,
      0,
      baseCanvas.width,
      baseCanvas.height,
      0,
      0,
      canvas.width,
      canvas.height
    );
    if (!hasVisibleMapPixels(context, canvas.width, canvas.height)) {
      throw new Error('DIRECT_MAP_CAPTURE_UNAVAILABLE');
    }
    drawCurrentMapOverlays(context, width, height, scale);
    drawMapAttribution(context, width, height, scale);

    const pngBlob = await canvasToPngBlob(canvas);
    const downloadUrl = URL.createObjectURL(pngBlob);
    const link = document.createElement('a');
    link.href = downloadUrl;
    link.download = getMapExportFilename();
    document.body.appendChild(link);
    link.click();
    link.remove();
    button.dataset.exportStatus = 'success';
    button.dataset.exportTheme = document.getElementById('THEME_SELECT')?.value || 'NORMAL';
    button.dataset.exportSignature = getMapPixelSignature(context, canvas.width, canvas.height);
    setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
  } catch (error) {
    button.dataset.exportStatus = 'error';
    console.error('Direct map PNG export failed', error);
    if (error?.message === 'DIRECT_MAP_CAPTURE_UNAVAILABLE') {
      alert('이 브라우저에서는 지도를 바로 저장할 수 없습니다. 다른 최신 브라우저에서 다시 시도해 주세요.');
    } else {
      alert('지도 이미지 저장에 실패했습니다. 다시 시도해 주세요.');
    }
  } finally {
    button.disabled = false;
    button.textContent = originalLabel;
  }
}

function bindMapExport(){
  document.getElementById('EXPORT_MAP')?.addEventListener('click', exportVisibleMapDirectly);
}
function initMap(){
  createMap({ mapTypeId: naver.maps.MapTypeId.NORMAL, customStyleId: null });
  ensureFillCanvasOverlay();
  bindThemeSelector();
  bindMapExport();

  bindToggleHandlers();
  bindLineRegionDropdownHandlers();
  bindFillToggleHandlers();
  bindFillRegionDropdownHandlers();
  bindColorHandlers();
  bindFillColorHandlers();
  bindFillBlendModeHandlers();
  bindFillOpacityHandlers();
  bindWeightHandlers();
  bindSearchHistory();
  bindUiVisibilityToggle();
  document.addEventListener('click', () => closeControlPanels());
  window.addEventListener('resize', requestFillCanvasRedraw);
  bindAddressSearch();
  bindAddressMarkerToggle();
}
window.initMap = initMap;

function createMap(extraOptions = {}){
  map = new naver.maps.Map('map', Object.assign({}, BASE_OPTIONS, extraOptions));
  bindMapRightClick();
}

function recreate(options = {}, doneActiveId = null){
  if (recreating) return;
  recreating = true;
  const center = map.getCenter();
  const zoom = map.getZoom();
  const wrap = document.getElementById('mapWrap');
  const old = document.getElementById('map');
  fillCanvasOverlay?.setMap(null);
  const fresh = document.createElement('div');
  fresh.id = 'map'; fresh.style.width = '100%'; fresh.style.height = '100%';
  wrap.replaceChild(fresh, old);
  createMap(Object.assign({ center, zoom }, options));
  if (doneActiveId) setActive(doneActiveId);
  setTimeout(()=>{ recreating = false; }, 80);
}

// recreate 을 오버레이 복원 기능으로 래핑합니다. 이 코드는 recreate 정의 이후에 위치해야 합니다.
const __recreateOrig = recreate;
recreate = function(options = {}, doneActiveId = null){
  __recreateOrig(options, doneActiveId);
  // 새 지도가 준비된 직후, 기존 오버레이를 복원합니다.
  setTimeout(restoreAllOverlaysOnNewMap, 100);
};

function setActive(id){
  const select = document.getElementById('THEME_SELECT');
  if (select) select.value = id;
}

function switchToTheme(styleId, btnId){
  recreate({ mapTypeId: naver.maps.MapTypeId.NORMAL, customStyleId: styleId }, btnId);
}

function switchToType(typeId, btnId){
  recreate({ mapTypeId: typeId, customStyleId: null }, btnId);
}
