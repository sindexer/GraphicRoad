<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="referrer" content="origin-when-cross-origin" />
<title>Map_JS</title>

<!-- Wanted Design System tokens — inlined so the page is fully self-contained
     (works standalone on GitHub Pages with no external _ds/ folder). -->
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-jp.min.css");
:root{
  --font-primary:"Pretendard JP",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --primary-normal:rgb(51,102,255);
  --primary-strong:rgb(44,90,232);
  --static-white:rgb(255,255,255);
  --label-normal:rgb(23,23,23);
  --label-neutral:rgba(46,47,51,0.88);
  --label-alternative:rgba(55,56,60,0.61);
  --line-normal-neutral:rgba(112,115,124,0.16);
  --line-normal-normal:rgba(112,115,124,0.22);
  --line-normal-strong:rgba(112,115,124,0.52);
  --background-normal-normal:#fff;
  --background-normal-alternative:rgb(248,248,249);
  --cool-grey-25:#fbfcfd;
  --cool-grey-50:#f5f7f9;
  --cool-grey-100:#edf1f4;
  --cool-grey-200:#dce2e8;
  --radius-xs:8px; --radius-sm:12px; --radius-md:16px;
  --shadow-popover:0 4px 16px rgba(23,23,23,0.10),0 1px 4px rgba(23,23,23,0.07);
  --type-tracking-normal:0.006em;
}
</style>

<style>
html, body {height:100%; margin:0}
#mapWrap {position:relative; width:100%; height:100%}
#map {width:100%; height:100%}

/* ============ Wanted Design System — control chrome ============ */
.top-navigation{
  position:absolute;
  z-index:1150;
  top:0;
  right:0;
  left:0;
  display:flex;
  align-items:center;
  gap:12px;
  min-height:68px;
  padding:12px 16px;
  box-sizing:border-box;
  overflow-x:auto;
  overflow-y:visible;
  border-bottom:1px solid var(--cool-grey-200);
  background:#fff;
  box-shadow:0 2px 10px rgba(34,43,54,.08);
  font-family:var(--font-primary);
  scrollbar-width:thin;
}
.address-search{
  position:relative;
  z-index:1;
  display:flex;
  flex:0 0 380px;
  flex-wrap:nowrap;
  align-items:center;
  gap:6px;
  width:380px;
  font-family:var(--font-primary);
}
.address-search input{
  flex:1;
  min-width:0;
  height:44px;
  padding:0 16px;
  border:1px solid var(--line-normal-normal, rgba(112,115,124,0.22));
  border-radius:var(--radius-sm, 12px);
  background:var(--cool-grey-25);
  box-shadow:none;
  font-family:var(--font-primary);
  font-size:15px;
  font-weight:500;
  letter-spacing:var(--type-tracking-normal, 0.006em);
  color:var(--label-normal, rgb(23,23,23));
  outline:none;
  transition:border-color .12s ease, box-shadow .12s ease;
}
.address-search input::placeholder{
  color:var(--label-alternative, rgba(55,56,60,0.61));
}
.address-search input:focus{
  border-color:var(--primary-normal, rgb(51,102,255));
  box-shadow:0 0 0 3px rgba(51,102,255,.16), var(--shadow-popover, 0 4px 16px rgba(23,23,23,.10));
}
.address-search button{
  flex:0 0 auto;
  height:44px;
  padding:0 14px;
  border:1px solid var(--cool-grey-200);
  border-radius:var(--radius-sm, 12px);
  background:var(--cool-grey-100);
  color:var(--label-neutral, rgba(46,47,51,0.88));
  font-family:var(--font-primary);
  font-size:15px;
  font-weight:600;
  letter-spacing:var(--type-tracking-normal, 0.006em);
  cursor:pointer;
  box-shadow:none;
  transition:background .12s ease, border-color .12s ease;
}
.address-search button:hover{
  background:#e5eaef;
  border-color:#cdd5dd;
}
/* the 핀 숨김/표시 secondary button */
.address-search #toggleAddressMarker{
  background:var(--background-normal-normal, #fff);
  color:var(--label-neutral, rgba(46,47,51,0.88));
  border:1px solid var(--line-normal-normal, rgba(112,115,124,0.22));
}
.address-search #toggleAddressMarker:hover{
  background:var(--background-normal-alternative, rgb(248,248,249));
  border-color:var(--line-normal-strong, rgba(112,115,124,0.52));
}
.address-search #toggleSearchHistory{
  width:38px;
  padding:0;
}
.search-history-chevron{
  display:inline-block;
  font-size:11px;
  transition:transform .14s ease;
}
#toggleSearchHistory[aria-expanded="true"] .search-history-chevron{
  transform:rotate(180deg);
}

.search-results,
.search-history-panel{
  position:fixed;
  z-index:1200;
  top:62px;
  right:16px;
  width:380px;
  max-width:calc(100vw - 32px);
  display:none;
  max-height:300px;
  overflow:auto;
  border:1px solid var(--line-normal-normal, rgba(112,115,124,0.22));
  border-radius:var(--radius-md, 16px);
  background:var(--background-normal-normal, #fff);
  box-shadow:var(--shadow-popover, 0 4px 16px rgba(23,23,23,.10));
}
.search-results.is-open{
  display:block;
}
.search-history-panel.is-open{
  display:block;
}
.search-history-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:42px;
  padding:0 12px 0 14px;
  border-bottom:1px solid var(--line-normal-neutral);
  color:var(--label-neutral);
  font-size:13px;
}
.address-search .search-history-clear{
  width:auto;
  height:28px;
  padding:0 8px;
  border:0;
  background:transparent;
  color:var(--label-alternative);
  font-size:12px;
  box-shadow:none;
}
.address-search .search-history-item{
  display:flex;
  align-items:center;
  width:100%;
  height:auto;
  min-height:42px;
  padding:10px 14px;
  border:0;
  border-bottom:1px solid var(--line-normal-neutral);
  border-radius:0;
  background:#fff;
  color:var(--label-normal);
  box-shadow:none;
  font-size:13px;
  text-align:left;
}
.address-search .search-history-item:last-child{ border-bottom:0; }
.address-search .search-history-item:hover{ background:var(--cool-grey-50); }
.address-search .search-result{
  display:block;
  width:100%;
  height:auto;
  padding:12px 14px;
  border:0;
  border-bottom:1px solid var(--line-normal-neutral, rgba(112,115,124,0.16));
  border-radius:0;
  background:var(--background-normal-normal, #fff);
  color:var(--label-normal, rgb(23,23,23));
  box-shadow:none;
  text-align:left;
  line-height:1.4;
  cursor:pointer;
  transition:background .1s ease;
}
.address-search .search-result:last-child{
  border-bottom:0;
}
.address-search .search-result:hover,
.address-search .search-result.is-selected{
  background:rgba(51,102,255,.08);
}
.search-result strong{
  display:block;
  margin-bottom:4px;
  font-size:14px;
  font-weight:600;
  color:var(--label-normal, rgb(23,23,23));
}
.search-result span,
.search-empty{
  display:block;
  color:var(--label-alternative, rgba(55,56,60,0.61));
  font-size:13px;
  font-weight:500;
  word-break:keep-all;
}
.search-empty{
  padding:14px 16px;
  font-family:var(--font-primary);
}

.buttons{
  position:absolute;
  z-index:1000;
  top:78px;
  left:16px;
  background:none;
  padding:0;
  border-radius:0;
  box-shadow:none;
  display:inline-block;
  font-family:var(--font-primary);
}
/* group containing theme/type buttons */
.primary-controls{
  display:flex;
  flex:0 0 auto;
  gap:3px;
  flex-wrap:nowrap;
}
/* group containing the 시도 및 시군구 토글 */
.secondary-controls{
  --secondary-control-gap:6px;
  display:flex;
  gap:var(--secondary-control-gap);
  flex-wrap:nowrap;
  overflow-x:auto;
  max-width:calc(100vw - 32px);
  padding-bottom:2px;
  font-size:0.6em;
  margin-top:0;
}
.boundary-controls-row{
  gap:0;
}
.boundary-control-group{
  display:flex;
  align-items:center;
  flex:0 0 auto;
  gap:var(--secondary-control-gap);
}
.boundary-group-spacer{
  width:calc(var(--secondary-control-gap) * 8);
  flex:0 0 calc(var(--secondary-control-gap) * 8);
}
.secondary-controls .control-btn{
  font-size:inherit;
}
.fill-controls{
  margin-top:0;
}
.fill-mode-control select{
  max-width:92px;
  border:0;
  outline:0;
  background:transparent;
  color:inherit;
  font:inherit;
  font-family:var(--font-primary);
  font-weight:600;
  cursor:pointer;
}
.fill-blend-canvas{
  position:absolute;
  left:0;
  top:0;
  z-index:900;
  display:block;
  pointer-events:none;
}

/* base toggle button — Wanted pill/chip look */
.control-btn{
  display:flex;
  align-items:center;
  gap:5px;
  border:1px solid var(--line-normal-normal, rgba(112,115,124,0.22));
  border-radius:var(--radius-sm, 12px);
  background:var(--background-normal-normal, #fff);
  color:var(--label-neutral, rgba(46,47,51,0.88));
  font-family:var(--font-primary);
  font-weight:600;
  letter-spacing:var(--type-tracking-normal, 0.006em);
  cursor:pointer;
  box-shadow:var(--shadow-popover, 0 4px 16px rgba(23,23,23,.10));
  transition:background .12s ease, border-color .12s ease, color .12s ease;
}
.control-btn:hover{
  background:var(--background-normal-alternative, rgb(248,248,249));
  border-color:var(--line-normal-strong, rgba(112,115,124,0.52));
}
.control-btn input[type="checkbox"]{
  margin:0 3px 0 0;
  accent-color:var(--primary-normal, rgb(51,102,255));
}
/* primary controls (theme / map type) */
.primary-controls .control-btn{
  padding:8px 6px;
  border-color:var(--cool-grey-200);
  background:var(--cool-grey-50);
  box-shadow:none;
  font-size:12px;
  white-space:nowrap;
}
.primary-controls .control-btn:hover{
  background:var(--cool-grey-100);
}
.primary-controls .control-btn.control-on{
  border-color:var(--primary-normal);
  background:var(--primary-normal);
  color:#fff;
}
/* secondary controls (per-sido toggles) */
.secondary-controls .control-btn{
  padding:6px 9px;
  border-radius:var(--radius-xs, 8px);
  flex:0 0 auto;
  white-space:nowrap;
}

.color-swatch{
  width:16px;
  height:16px;
  flex:0 0 16px;
  padding:0;
  border:1px solid var(--line-normal-normal, rgba(112,115,124,0.22));
  border-radius:50%;
  background:transparent;
  cursor:pointer;
  overflow:hidden;
  appearance:none;
  -webkit-appearance:none;
}
.color-swatch::-webkit-color-swatch-wrapper{ padding:0; }
.color-swatch::-webkit-color-swatch{ border:0; border-radius:50%; }
.color-swatch::-moz-color-swatch{ border:0; border-radius:50%; }

.line-weight-control > button,
.fill-opacity-control > button{
  border:0;
  background:transparent;
  color:inherit;
  font:inherit;
  font-family:var(--font-primary);
  font-weight:600;
  padding:0;
  cursor:pointer;
}
.line-weight-panel,
.fill-opacity-panel,
.fill-region-panel,
.line-region-panel{
  position:absolute;
  z-index:1200;
  display:none;
  border:1px solid var(--line-normal-normal, rgba(112,115,124,0.22));
  border-radius:var(--radius-md, 16px);
  background:var(--background-normal-normal, #fff);
  box-shadow:var(--shadow-popover, 0 4px 16px rgba(23,23,23,.10));
  color:var(--label-normal, rgb(23,23,23));
  font-family:var(--font-primary);
  white-space:nowrap;
}
.line-weight-panel,
.fill-opacity-panel{
  align-items:center;
  flex-direction:column;
  gap:8px;
  padding:12px 12px 14px;
}
.line-weight-panel.is-open,
.fill-opacity-panel.is-open{ display:flex; }
.line-weight-panel input[type="range"],
.fill-opacity-panel input[type="range"]{
  width:28px;
  height:120px;
  accent-color:var(--primary-normal, rgb(51,102,255));
  writing-mode:vertical-lr;
  direction:rtl;
}
.line-weight-value,
.fill-opacity-value{
  min-width:24px;
  text-align:center;
  font-family:var(--font-mono, "SF Mono", monospace);
  font-variant-numeric:tabular-nums;
  font-weight:600;
}

.fill-region-trigger,
.line-region-trigger{
  border:1px solid var(--line-normal-normal, rgba(112,115,124,0.22));
}
.fill-region-trigger .fill-region-chevron,
.line-region-trigger .fill-region-chevron{
  color:var(--label-alternative, rgba(55,56,60,0.61));
  font-size:10px;
  transition:transform .12s ease;
}
.fill-region-trigger[aria-expanded="true"] .fill-region-chevron,
.line-region-trigger[aria-expanded="true"] .fill-region-chevron{
  transform:rotate(180deg);
}
.fill-region-trigger.has-active-fill{
  border-color:var(--primary-normal, rgb(51,102,255));
  color:var(--primary-normal, rgb(51,102,255));
}
.line-region-trigger.has-active-line{
  border-color:var(--primary-normal, rgb(51,102,255));
  color:var(--primary-normal, rgb(51,102,255));
}
.fill-region-count:empty,
.line-region-count:empty{ display:none; }
.fill-region-count,
.line-region-count{
  min-width:16px;
  padding:1px 4px;
  border-radius:999px;
  background:var(--primary-normal, rgb(51,102,255));
  color:var(--static-white, #fff);
  font-size:10px;
  line-height:14px;
  text-align:center;
}
.fill-region-panel{
  width:190px;
  max-width:calc(100vw - 32px);
  padding:8px;
}
.fill-region-panel.is-open{ display:block; }
.fill-region-panel-header{
  padding:6px 8px 8px;
  color:var(--label-neutral, rgba(46,47,51,0.88));
  font-size:12px;
  font-weight:700;
}
.fill-region-options{
  max-height:min(320px, calc(100vh - 170px));
  overflow-y:auto;
  scrollbar-gutter:stable;
}
.fill-region-option{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:34px;
  padding:4px 8px;
  border-radius:8px;
  color:var(--label-normal, rgb(23,23,23));
  font-size:13px;
  font-weight:500;
  cursor:pointer;
}
.fill-region-option:hover{
  background:var(--background-normal-alternative, rgb(248,248,249));
}
.fill-region-option-all{
  position:sticky;
  z-index:1;
  top:0;
  margin-bottom:4px;
  padding-bottom:8px;
  border-bottom:1px solid var(--line-normal-normal, rgba(112,115,124,0.22));
  border-radius:0;
  background:var(--background-normal-normal, #fff);
  font-weight:700;
}
.fill-region-option input{
  margin:0;
  accent-color:var(--primary-normal, rgb(51,102,255));
}
.fill-region-loading,
.fill-region-error{
  padding:14px 8px;
  color:var(--label-alternative, rgba(55,56,60,0.61));
  font-size:12px;
  text-align:center;
}
.fill-region-error{ color:#d93025; }

/* active toggle state — Wanted primary */
.control-on{
  border-color:var(--primary-normal, rgb(51,102,255));
  background:var(--primary-normal, rgb(51,102,255));
  color:var(--static-white, #fff);
}
.control-on:hover{
  background:var(--primary-strong, rgb(44,90,232));
  border-color:var(--primary-strong, rgb(44,90,232));
}
body.ui-hidden .top-navigation{
  right:auto;
  min-height:0;
  padding:16px;
  overflow:visible;
  border:0;
  background:transparent;
  box-shadow:none;
  pointer-events:none;
}
body.ui-hidden .primary-controls > :not(#TOGGLE_UI_VISIBILITY),
body.ui-hidden .address-search,
body.ui-hidden .buttons{
  display:none !important;
}
body.ui-hidden #TOGGLE_UI_VISIBILITY{
  display:flex;
  pointer-events:auto;
  box-shadow:var(--shadow-popover);
}
</style>

<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=htcml1d5g3&submodules=gl,geocoder&callback=initMap"></script>
<!-- topojson-client library for converting TopoJSON to GeoJSON. Even though
     시군구 데이터를 GeoJSON 형식으로 분할하여 사용하지만, 시도 데이터는 TopoJSON
     그대로 사용하므로 이 라이브러리를 남겨둡니다. GeoJSON 데이터를 로드할 때는
     topojson.feature() 호출을 건너뜁니다. -->
<script src="https://unpkg.com/topojson-client@3"></script>
</head>
<body>
<div id="mapWrap">
<div id="map"></div>
<nav id="TOP_NAVIGATION" class="top-navigation" aria-label="지도 도구">
<div class="primary-controls">
<!-- 테마 버튼들 (좌측부터 Blue / Blue(NoSB) / Dark / White) -->
<input id="BLUE" type="button" value="Blue" class="control-btn">
<input id="BLUENOSB" type="button" value="Blue(NoSB)" class="control-btn">
<input id="DARK" type="button" value="Dark" class="control-btn">
<input id="WHITE" type="button" value="White" class="control-btn">
<!-- 기본 타입들 -->
<input id="NORMAL" type="button" value="일반지도" class="control-btn control-on">
<input id="TERRAIN" type="button" value="지형도" class="control-btn">
<input id="SATELLITE" type="button" value="위성지도" class="control-btn">
<input id="HYBRID" type="button" value="겹쳐보기" class="control-btn">
<input id="GOOGLEVECTOR" type="button" value="구글Vector" class="control-btn" onclick="window.open('https://mapstyle.withgoogle.com/','_blank','noopener,noreferrer')">
<input id="GOOGLEMAP" type="button" value="구글Map" class="control-btn" onclick="window.open('https://www.google.com/maps/@25.2723225,41.6800099,6811525m/data=!3m1!1e3?entry=ttu&amp;g_ep=EgoyMDI2MDgwMi4wIKXMDSoASAFQAw%3D%3D','_blank','noopener,noreferrer')">
<input id="KAKAOMAP" type="button" value="카카오Map" class="control-btn" onclick="window.open('https://map.kakao.com/','_blank','noopener,noreferrer')">
<input id="VWORLD3D" type="button" value="Vworld3D" class="control-btn" onclick="window.open('https://map.vworld.kr/map/dtkmap.do?mode=MAPW201','_blank','noopener,noreferrer')">
<input id="SMAP3D" type="button" value="S-map 3D" class="control-btn" onclick="window.open('https://smap.seoul.go.kr/','_blank','noopener,noreferrer')">
<button id="TOGGLE_UI_VISIBILITY" type="button" class="control-btn" aria-pressed="false">UI 숨김</button>
</div>
<form id="addressSearch" class="address-search">
<input id="addressInput" type="text" placeholder="상호, 키워드, 주소를 입력하세요" autocomplete="off">
<button id="toggleSearchHistory" type="button" aria-expanded="false" aria-controls="searchHistory" aria-label="과거 검색목록 열기" title="과거 검색목록"><span class="search-history-chevron" aria-hidden="true">▼</span></button>
<button type="submit">검색</button>
<button id="toggleAddressMarker" type="button">핀 숨김</button>
<div id="searchHistory" class="search-history-panel" aria-label="과거 검색목록">
<div class="search-history-header"><strong>과거 검색목록</strong><button id="clearSearchHistory" class="search-history-clear" type="button">전체 삭제</button></div>
<div id="searchHistoryList"></div>
</div>
<div id="searchResults" class="search-results" aria-live="polite"></div>
</form>
</nav>
<div class="buttons">
<div class="secondary-controls boundary-controls-row">
<div class="boundary-control-group line-controls">
<!-- 추가된 토글: 시도 라인 / 시군구(각 시도별) 라인 -->
<label class="control-btn line-color-control">라인색 <input id="COLOR_LINES" class="color-swatch" type="color" value="#333333" title="전체 라인 색상" aria-label="전체 라인 색상"></label>
<div class="control-btn line-weight-control" id="LINE_WEIGHT_CONTROL">
<button id="TOGGLE_LINE_WEIGHT" type="button" aria-expanded="false" aria-controls="LINE_WEIGHT_PANEL">라인굵기</button>
</div>
<label class="control-btn"><input id="TOGGLE_SIDO" type="checkbox"> 시도</label>
<button id="LINE_REGION_DROPDOWN" class="control-btn line-region-trigger" type="button" aria-expanded="false" aria-controls="LINE_REGION_PANEL" aria-label="시군구 라인, 0개 선택"><span>시군구</span><span class="line-region-count"></span><span class="fill-region-chevron" aria-hidden="true">▼</span></button>
</div>
<div class="boundary-group-spacer" aria-hidden="true"></div>
<div class="boundary-control-group fill-controls">
<label class="control-btn fill-color-control">채움색 <input id="COLOR_FILLS" class="color-swatch" type="color" value="#ffffff" title="전체 채움 색상" aria-label="전체 채움 색상"></label>

<script>
// theme style IDs
const STYLE_WHITE = '7020740f-78b0-448e-804e-0d702f5db72e';
const STYLE_DARK = '2a9d2f05-79b2-4590-92ee-9f30d52af0bc';
const STYLE_BLUE = '13737385-1d14-471f-89a0-7725f38c4a0f';
const STYLE_BLUE_NOSB = '91ec720a-a3e2-4d1e-8b9d-ed094c40d998'; // new

const BASE_OPTIONS = {
  gl: true,
  center: new naver.maps.LatLng(37.5666103, 126.9783882),
  zoom: 15,
  // 네이버 지도 API v3는 최소 줌 레벨을 6 이상으로 설정해야 합니다.
  minZoom: 6, maxZoom: 20, tileSpare: 2
};

let map;
let recreating = false;
let addressMarker = null;
let searchedLatLng = null;
let addressMarkerVisible = true;
let rightClickInfoWindow = null;
let activeSearchResults = [];
let searchHistoryQueries = [];
let fillCanvasOverlay = null;
let currentFillBlendMode = 'normal';

// ====== 행정구역 경계 오버레이 관련 변수 및 함수 ======
const DEFAULT_LINE_COLOR = '#333333';
const DEFAULT_LINE_WEIGHT = 2;
const DEFAULT_FILL_COLOR = '#ffffff';
const DEFAULT_FILL_OPACITY = 0.5;
const DEFAULT_FILL_BLEND_MODE = 'normal';
const SEARCH_HISTORY_STORAGE_KEY = 'graphicRoad.searchHistory.v1';
const MAX_SEARCH_HISTORY = 12;
const FILL_BLEND_MODE_STYLES = Object.freeze({
  normal: 'normal',
  add: 'plus-lighter',
  multiply: 'multiply',
  screen: 'screen',
  overlay: 'overlay',
  darken: 'darken',
  lighten: 'lighten',
  'color-dodge': 'color-dodge',
  'color-burn': 'color-burn',
  'soft-light': 'soft-light',
  'hard-light': 'hard-light',
  difference: 'difference',
  exclusion: 'exclusion',
  hue: 'hue',
  saturation: 'saturation',
  color: 'color',
  luminosity: 'luminosity',
  'plus-darker': 'plus-darker'
});

// 각 레이어의 상태와 데이터 캐시를 관리하는 객체입니다.
const lineLayers = {
  // 시도 경계: TopoJSON 파일 (Gunwi 편입 후 최적화 버전)
  sido: {
    overlays: [], // Polyline 객체들이 저장됩니다.
    visible: false, // 현재 지도에 표시 중인지 여부
    loaded: false, // GeoJSON을 읽어 왔는지 여부
    // WGS84 좌표계의 시도 경계 GeoJSON (Gunwi 편입 후 최적화 버전)
    url: './data/sido_gunwi_optimized.topojson'
  },
  // 시군구 경계: 시도별 TopoJSON 파일 (분할된 경계, Gunwi 편입 반영)
  // 최적화된 GeoJSON 대신 각 시도별로 생성된 TopoJSON을 사용합니다. 이는 중복된 경계를 하나만 저장해 더 빠른 로딩 속도를 제공합니다.
  sigungu_11: { overlays: [], visible: false, loaded: false, url: './data/highdetail_split_geo/sigungu_11.geojson' }, // 서울특별시
  sigungu_21: { overlays: [], visible: false, loaded: false, url: './data/highdetail_split_geo/sigungu_21.geojson' }, // 부산광역시
  sigungu_22: { overlays: [], visible: false, loaded: false, url: './data/highdetail_split_geo/sigungu_22.geojson' }, // 대구광역시 (군위군 포함)
  sigungu_23: { overlays: [], visible: false, loaded: false, url: './data/highdetail_split_geo/sigungu_23.geojson' }, // 인천광역시
  sigungu_24: { overlays: [], visible: false, loaded: false, url: './data/highdetail_split_geo/sigungu_24.geojson' }, // 광주광역시
  sigungu_25: { overlays: [], visible: false, loaded: false, url: './data/highdetail_split_geo/sigungu_25.geojson' }, // 대전광역시
  sigungu_26: { overlays: [], visible: false, loaded: false, url: './data/highdetail_split_geo/sigungu_26.geojson' }, // 울산광역시
  sigungu_29: { overlays: [], visible: false, loaded: false, url: './data/highdetail_split_geo/sigungu_29.geojson' }, // 세종특별자치시
  sigungu_31: { overlays: [], visible: false, loaded: false, url: './data/highdetail_split_geo/sigungu_31.geojson' }, // 경기도
  sigungu_32: { overlays: [], visible: false, loaded: false, url: './data/highdetail_split_geo/sigungu_32.geojson' }, // 강원도
  sigungu_33: { overlays: [], visible: false, loaded: false, url: './data/highdetail_split_geo/sigungu_33.geojson' }, // 충청북도
  sigungu_34: { overlays: [], visible: false, loaded: false, url: './data/highdetail_split_geo/sigungu_34.geojson' }, // 충청남도
  sigungu_35: { overlays: [], visible: false, loaded: false, url: './data/highdetail_split_geo/sigungu_35.geojson' }, // 전라북도
  sigungu_36: { overlays: [], visible: false, loaded: false, url: './data/highdetail_split_geo/sigungu_36.geojson' }, // 전라남도
  sigungu_37: { overlays: [], visible: false, loaded: false, url: './data/highdetail_split_geo/sigungu_37.geojson' }, // 경상북도
  sigungu_38: { overlays: [], visible: false, loaded: false, url: './data/highdetail_split_geo/sigungu_38.geojson' }, // 경상남도
  sigungu_39: { overlays: [], visible: false, loaded: false, url: './data/highdetail_split_geo/sigungu_39.geojson' } // 제주특별자치도
};

Object.values(lineLayers).forEach(info => {
  info.color = DEFAULT_LINE_COLOR;
  info.weight = DEFAULT_LINE_WEIGHT;
  info.fillOverlays = [];
  info.fillVisible = false;
  info.fillLoaded = false;
  info.fillColor = DEFAULT_FILL_COLOR;
  info.fillOpacity = DEFAULT_FILL_OPACITY;
  info.fillItems = [];
  info.geo = null;
  info.loadPromise = null;
});

// 선의 스타일 지정 (색상과 굵기)
const STYLE_SIDO = {
  strokeColor: '#333333',
  strokeWeight: 2,
  strokeOpacity: 0.95
};
const STYLE_SIGUNGU = {
  // 시군구 경계의 선 스타일을 시도 경계와 동일하게 설정합니다.
  // 시도 경계의 색상과 굵기(#333333, weight 2, opacity 0.95)를 그대로 사용하여 통일감을 줍니다.
  strokeColor: '#333333',
  strokeWeight: 2,
  strokeOpacity: 0.95
};
const STYLE_FILL = {
  fillColor: DEFAULT_FILL_COLOR,
  fillOpacity: DEFAULT_FILL_OPACITY
};

// GeoJSON 좌표 [lng, lat] 을 naver.maps.LatLng 객체로 변환
function coordsToLatLngs(coords) {
  return new naver.maps.LatLng(coords[1], coords[0]);
}

// Linear ring 배열을 Polyline 경로로 변환
function ringToPath(ring) {
  return ring.map(coordsToLatLngs);
}

function resolveFillBlendStyle(mode) {
  const style = FILL_BLEND_MODE_STYLES[mode] || FILL_BLEND_MODE_STYLES[DEFAULT_FILL_BLEND_MODE];
  if (window.CSS && typeof window.CSS.supports === 'function' && !window.CSS.supports('mix-blend-mode', style)) {
    if (style === 'plus-lighter') return 'screen';
    if (style === 'plus-darker') return 'darken';
    return 'normal';
  }
  return style;
}

function drawFillPolygonPaths(context, polygonPaths, projection) {
  context.beginPath();
  let hasPoints = false;
  polygonPaths.forEach(ring => {
    ring.forEach((coord, index) => {
      const point = projection.fromCoordToOffset(coord);
      if (!point || !Number.isFinite(point.x) || !Number.isFinite(point.y)) return;
      if (index === 0) context.moveTo(point.x, point.y);
      else context.lineTo(point.x, point.y);
      hasPoints = true;
    });
    context.closePath();
  });
  if (hasPoints) context.fill('evenodd');
}

function drawVisibleFillCanvas(context, projection) {
  Object.keys(lineLayers).forEach(kind => {
    const info = lineLayers[kind];
    if (!info.fillLoaded) return;
    context.save();
    context.fillStyle = info.fillColor || DEFAULT_FILL_COLOR;
    context.globalAlpha = Number.isFinite(info.fillOpacity) ? info.fillOpacity : DEFAULT_FILL_OPACITY;
    info.fillItems.forEach(item => {
      const visible = kind === 'sido' ? info.fillVisible : item.visible;
      if (!visible) return;
      item.canvasPolygons.forEach(polygonPaths => {
        drawFillPolygonPaths(context, polygonPaths, projection);
      });
    });
    context.restore();
  });
}

function FillCanvasOverlay(options = {}) {
  this._canvas = document.createElement('canvas');
  this._canvas.className = 'fill-blend-canvas';
  this._canvas.setAttribute('aria-hidden', 'true');
  this._blendMode = options.blendMode || DEFAULT_FILL_BLEND_MODE;
  this.setMap(options.map || null);
}

FillCanvasOverlay.prototype = new naver.maps.OverlayView();
FillCanvasOverlay.prototype.constructor = FillCanvasOverlay;

FillCanvasOverlay.prototype.onAdd = function() {
  this.getPanes().overlayLayer.appendChild(this._canvas);
  this.setBlendMode(this._blendMode);
};

FillCanvasOverlay.prototype.draw = function() {
  if (!this.getMap() || !this._canvas.isConnected) return;
  const mapElement = document.getElementById('map');
  if (!mapElement) return;
  const width = mapElement.clientWidth;
  const height = mapElement.clientHeight;
  if (!width || !height) return;

  const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  const canvasWidth = Math.round(width * pixelRatio);
  const canvasHeight = Math.round(height * pixelRatio);
  if (this._canvas.width !== canvasWidth || this._canvas.height !== canvasHeight) {
    this._canvas.width = canvasWidth;
    this._canvas.height = canvasHeight;
    this._canvas.style.width = width + 'px';
    this._canvas.style.height = height + 'px';
  }

  const context = this._canvas.getContext('2d');
  context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
  context.clearRect(0, 0, width, height);
  context.globalCompositeOperation = 'source-over';
  drawVisibleFillCanvas(context, this.getProjection());
};

FillCanvasOverlay.prototype.onRemove = function() {
  this._canvas.remove();
};

FillCanvasOverlay.prototype.setBlendMode = function(mode) {
  this._blendMode = FILL_BLEND_MODE_STYLES[mode] ? mode : DEFAULT_FILL_BLEND_MODE;
  this._canvas.dataset.blendMode = this._blendMode;
  this._canvas.style.mixBlendMode = resolveFillBlendStyle(this._blendMode);
};

FillCanvasOverlay.prototype.requestDraw = function() {
  this.draw();
};

function ensureFillCanvasOverlay() {
  if (!fillCanvasOverlay) {
    fillCanvasOverlay = new FillCanvasOverlay({ map, blendMode: currentFillBlendMode });
    return fillCanvasOverlay;
  }
  if (fillCanvasOverlay.getMap() !== map) {
    fillCanvasOverlay.setMap(map);
  }
  fillCanvasOverlay.setBlendMode(currentFillBlendMode);
  return fillCanvasOverlay;
}

function requestFillCanvasRedraw() {
  fillCanvasOverlay?.requestDraw();
}

function setFillBlendMode(mode) {
  currentFillBlendMode = FILL_BLEND_MODE_STYLES[mode] ? mode : DEFAULT_FILL_BLEND_MODE;
  ensureFillCanvasOverlay().setBlendMode(currentFillBlendMode);
  requestFillCanvasRedraw();
}

// Polyline 생성 유틸
function makePolyline(path, style) {
  return new naver.maps.Polyline({
    map: null,
    path,
    strokeColor: style.strokeColor,
    strokeWeight: style.strokeWeight,
    strokeOpacity: style.strokeOpacity,
    clickable: false,
    zIndex: 1000
  });
}

function makeFillPolygon(polygonCoords, style) {
  return new naver.maps.Polygon({
    map: null,
    paths: polygonCoords.map(ringToPath),
    fillColor: style.fillColor,
    fillOpacity: style.fillOpacity,
    strokeColor: 'transparent',
    strokeOpacity: 0,
    strokeWeight: 0,
    clickable: false,
    zIndex: 900
  });
}

function updatePolylineColor(polyline, color) {
  if (typeof polyline.setOptions === 'function') {
    polyline.setOptions({ strokeColor: color });
    return;
  }
  if (typeof polyline.set === 'function') {
    polyline.set('strokeColor', color);
  }
}

function setLayerColor(kind, color) {
  const info = lineLayers[kind];
  if (!info) return;
  info.color = color || DEFAULT_LINE_COLOR;
  info.overlays.forEach(polyline => updatePolylineColor(polyline, info.color));
}

function setAllLayerColors(color) {
  Object.keys(lineLayers).forEach(kind => setLayerColor(kind, color));
}

function updateFillColor(polygon, color) {
  if (typeof polygon.setOptions === 'function') {
    polygon.setOptions({ fillColor: color });
    return;
  }
  if (typeof polygon.set === 'function') {
    polygon.set('fillColor', color);
  }
}

function setFillLayerColor(kind, color, shouldRedraw = true) {
  const info = lineLayers[kind];
  if (!info) return;
  info.fillColor = color || DEFAULT_FILL_COLOR;
  info.fillOverlays.forEach(polygon => updateFillColor(polygon, info.fillColor));
  if (shouldRedraw) requestFillCanvasRedraw();
}

function setAllFillColors(color) {
  Object.keys(lineLayers).forEach(kind => setFillLayerColor(kind, color, false));
  requestFillCanvasRedraw();
}

function updateFillOpacity(polygon, opacity) {
  if (typeof polygon.setOptions === 'function') {
    polygon.setOptions({
      fillOpacity: opacity,
      strokeColor: 'transparent',
      strokeOpacity: 0,
      strokeWeight: 0
    });
    return;
  }
  if (typeof polygon.set === 'function') {
    polygon.set('fillOpacity', opacity);
    polygon.set('strokeColor', 'transparent');
    polygon.set('strokeOpacity', 0);
    polygon.set('strokeWeight', 0);
  }
}

function setFillLayerOpacity(kind, opacity, shouldRedraw = true) {
  const info = lineLayers[kind];
  if (!info) return;
  const nextOpacity = Math.max(0, Math.min(1, Number(opacity)));
  info.fillOpacity = Number.isFinite(nextOpacity) ? nextOpacity : DEFAULT_FILL_OPACITY;
  info.fillOverlays.forEach(polygon => updateFillOpacity(polygon, info.fillOpacity));
  if (shouldRedraw) requestFillCanvasRedraw();
}

function setAllFillOpacities(opacity) {
  Object.keys(lineLayers).forEach(kind => setFillLayerOpacity(kind, opacity, false));
  requestFillCanvasRedraw();
}

function updatePolylineWeight(polyline, weight) {
  if (typeof polyline.setOptions === 'function') {
    polyline.setOptions({ strokeWeight: weight });
    return;
  }
  if (typeof polyline.set === 'function') {
    polyline.set('strokeWeight', weight);
  }
}

function setLayerWeight(kind, weight) {
  const info = lineLayers[kind];
  if (!info) return;
  const nextWeight = Number(weight) || DEFAULT_LINE_WEIGHT;
  info.weight = nextWeight;
  info.overlays.forEach(polyline => updatePolylineWeight(polyline, nextWeight));
}

function setAllLayerWeights(weight) {
  Object.keys(lineLayers).forEach(kind => setLayerWeight(kind, weight));
}

// GeoJSON Polygon 구조에서 Polyline 생성하여 버킷에 추가
function addPolylinesFromPolygon(polygonCoords, style, bucket) {
  polygonCoords.forEach(ring => {
    const path = ringToPath(ring);
    const pl = makePolyline(path, style);
    bucket.push(pl);
  });
}

// GeoJSON MultiPolygon 구조에서 Polyline 생성하여 버킷에 추가
function addPolylinesFromMultiPolygon(multiCoords, style, bucket) {
  multiCoords.forEach(poly => addPolylinesFromPolygon(poly, style, bucket));
}

function addFillPolygonsFromPolygon(polygonCoords, style, bucket) {
  bucket.push(makeFillPolygon(polygonCoords, style));
}

function addFillPolygonsFromMultiPolygon(multiCoords, style, bucket) {
  multiCoords.forEach(poly => addFillPolygonsFromPolygon(poly, style, bucket));
}

function getGeoFeatures(geo) {
  return (geo.type === 'FeatureCollection')
    ? geo.features
    : (geo.type === 'Feature'
      ? [geo]
      : [{ type: 'Feature', geometry: geo }]);
}

async function getBoundaryGeoJSON(kind) {
  const info = lineLayers[kind];
  if (info.geo) return info.geo;
  if (info.loadPromise) return info.loadPromise;

  info.loadPromise = (async () => {
    const res = await fetch(info.url, { cache: 'no-cache' });
    if (!res.ok) throw new Error('GeoJSON 로드 실패: ' + info.url);
    const raw = await res.json();
    let geo;
    if (raw && raw.type === 'Topology') {
      const topologyObject = raw.objects.collection || Object.values(raw.objects)[0];
      geo = topojson.feature(raw, topologyObject);
    } else {
      geo = raw;
    }
    info.geo = geo;
    return geo;
  })();

  try {
    return await info.loadPromise;
  } catch (err) {
    info.loadPromise = null;
    throw err;
  }
}

// 지정된 종류(k: 'sido'|'sigungu')의 GeoJSON을 최초 1회만 불러와서 Polyline 생성
async function loadGeoJSONOnce(kind) {
  const info = lineLayers[kind];
  if (info.loaded) return;
  const geo = await getBoundaryGeoJSON(kind);
  const bucket = info.overlays;
  const baseStyle = (kind === 'sido') ? STYLE_SIDO : STYLE_SIGUNGU;
  const style = Object.assign({}, baseStyle, {
    strokeColor: info.color || DEFAULT_LINE_COLOR,
    strokeWeight: info.weight || DEFAULT_LINE_WEIGHT
  });
  const features = getGeoFeatures(geo);
  features.forEach(f => {
    if (!f || !f.geometry) return;
    const g = f.geometry;
    if (g.type === 'Polygon') {
      addPolylinesFromPolygon(g.coordinates, style, bucket);
    } else if (g.type === 'MultiPolygon') {
      addPolylinesFromMultiPolygon(g.coordinates, style, bucket);
    }
  });
  info.loaded = true;
}

async function loadFillGeoJSONOnce(kind) {
  const info = lineLayers[kind];
  if (info.fillLoaded) return;
  const geo = await getBoundaryGeoJSON(kind);
  const style = Object.assign({}, STYLE_FILL, {
    fillColor: info.fillColor || DEFAULT_FILL_COLOR,
    fillOpacity: Number.isFinite(info.fillOpacity) ? info.fillOpacity : DEFAULT_FILL_OPACITY
  });
  info.fillItems = [];
  getGeoFeatures(geo).forEach((f, index) => {
    if (!f || !f.geometry) return;
    const featureOverlays = [];
    const canvasPolygons = [];
    const g = f.geometry;
    if (g.type === 'Polygon') {
      addFillPolygonsFromPolygon(g.coordinates, style, featureOverlays);
      canvasPolygons.push(g.coordinates.map(ringToPath));
    } else if (g.type === 'MultiPolygon') {
      addFillPolygonsFromMultiPolygon(g.coordinates, style, featureOverlays);
      g.coordinates.forEach(polygonCoords => {
        canvasPolygons.push(polygonCoords.map(ringToPath));
      });
    }
    if (!canvasPolygons.length) return;
    const properties = f.properties || {};
    const name = properties.name || properties.SIG_KOR_NM || properties.CTP_KOR_NM || ('지역 ' + (index + 1));
    const id = String(properties.code || properties.SIG_CD || properties.CTPRVN_CD || (kind + '_' + index));
    info.fillItems.push({ id, name, overlays: featureOverlays, canvasPolygons, visible: false });
    info.fillOverlays.push(...featureOverlays);
  });
  info.fillLoaded = true;
}

// 현재 visible 상태에 따라 지도에 오버레이를 적용/제거
function applyVisibility(kind) {
  const { overlays, visible } = lineLayers[kind];
  overlays.forEach(pl => pl.setMap(visible ? map : null));
}

function applyFillVisibility(kind) {
  const info = lineLayers[kind];
  if (!info) return;
  info.fillOverlays.forEach(polygon => polygon.setMap(null));
  requestFillCanvasRedraw();
}

function applyFillFeatureVisibility(kind, itemIndex) {
  const info = lineLayers[kind];
  const item = info?.fillItems[itemIndex];
  if (!item) return;
  item.overlays.forEach(polygon => polygon.setMap(null));
  requestFillCanvasRedraw();
}

function setAllFillFeatureVisibility(kind, visible) {
  const info = lineLayers[kind];
  if (!info) return;
  info.fillItems.forEach(item => {
    item.visible = visible;
  });
  applyFillVisibility(kind);
}

function restoreAllOverlaysOnNewMap() {

    if (lineLayers[k].visible) {
      lineLayers[k].overlays.forEach(pl => pl.setMap(map));

function hideSearchResults() {
  document.getElementById('searchResults')?.classList.remove('is-open');
}

function setSearchHistoryOpen(open) {
  const panel = document.getElementById('searchHistory');
  const button = document.getElementById('toggleSearchHistory');
  if (!panel || !button) return;
  panel.classList.toggle('is-open', open);
  button.setAttribute('aria-expanded', String(open));
  button.setAttribute('aria-label', open ? '과거 검색목록 닫기' : '과거 검색목록 열기');
  if (open) hideSearchResults();
}

function loadSearchHistory() {
  try {
    const stored = JSON.parse(localStorage.getItem(SEARCH_HISTORY_STORAGE_KEY) || '[]');
    searchHistoryQueries = Array.isArray(stored)
      ? stored.filter(query => typeof query === 'string' && query.trim()).slice(0, MAX_SEARCH_HISTORY)
      : [];
  } catch (err) {
    searchHistoryQueries = [];
  }
}

function saveSearchHistory() {
  try {
    localStorage.setItem(SEARCH_HISTORY_STORAGE_KEY, JSON.stringify(searchHistoryQueries));
  } catch (err) {
    console.warn('Search history could not be saved', err);
  }
}

function renderSearchHistory() {
  const list = document.getElementById('searchHistoryList');
  if (!list) return;
  if (!searchHistoryQueries.length) {
    list.innerHTML = '<div class="search-empty">저장된 검색어가 없습니다.</div>';
    return;
  }
  list.innerHTML = searchHistoryQueries.map((query, index) => (
    '<button class="search-history-item" type="button" data-history-index="' + index + '">' +
    escapeHtml(query) +
    '</button>'
  )).join('');
  list.querySelectorAll('.search-history-item').forEach(button => {
    button.addEventListener('click', () => {
      const query = searchHistoryQueries[Number(button.dataset.historyIndex)];
      const input = document.getElementById('addressInput');
      if (!query || !input) return;
      input.value = query;
      rememberSearchQuery(query);
      setSearchHistoryOpen(false);
      moveToAddress(query);
    });
  });
}

function rememberSearchQuery(query) {
  const normalized = String(query || '').trim();
  if (!normalized) return;
  searchHistoryQueries = [
    normalized,
    ...searchHistoryQueries.filter(saved => saved.toLocaleLowerCase() !== normalized.toLocaleLowerCase())
  ].slice(0, MAX_SEARCH_HISTORY);
  saveSearchHistory();
  renderSearchHistory();
}

function bindSearchHistory() {
  const form = document.getElementById('addressSearch');
  const button = document.getElementById('toggleSearchHistory');
  const panel = document.getElementById('searchHistory');
  const clearButton = document.getElementById('clearSearchHistory');
  if (!form || !button || !panel || !clearButton) return;

  loadSearchHistory();
  renderSearchHistory();
  button.addEventListener('click', e => {
    e.stopPropagation();
    setSearchHistoryOpen(!panel.classList.contains('is-open'));
  });
  panel.addEventListener('click', e => e.stopPropagation());
  clearButton.addEventListener('click', () => {
    searchHistoryQueries = [];
    saveSearchHistory();
    renderSearchHistory();
  });
  document.addEventListener('click', e => {
    if (!form.contains(e.target)) setSearchHistoryOpen(false);
  });
}

    if (!addressMarker) {

      return;

function showSearchStatus(message) {
  const results = document.getElementById('searchResults');
  if (!results) return;
  setSearchHistoryOpen(false);
  results.innerHTML = '<div class="search-empty">' + escapeHtml(message) + '</div>';
  results.classList.add('is-open');
}

function geocodeNaver(query) {
  return new Promise(resolve => {
    if (!window.naver || !naver.maps || !naver.maps.Service || !naver.maps.Service.geocode) {
      resolve([]);
      return;
    }
    naver.maps.Service.geocode({ query }, (status, response) => {
      if (status !== naver.maps.Service.Status.OK) {
        resolve([]);
        return;
      }
      const addresses = response?.v2?.addresses || [];
      resolve(addresses.map((item, index) => ({
        title: item.roadAddress || item.jibunAddress || query,
        address: item.roadAddress || item.jibunAddress || item.englishAddress || '',
        lat: Number(item.y),
        lng: Number(item.x),
        source: index === 0 ? 'Naver address' : 'Naver candidate'
      })).filter(item => Number.isFinite(item.lat) && Number.isFinite(item.lng)));
    });
  });
}

async function searchOpenStreetMap(query) {
  const params = new URLSearchParams({
    q: query,
    format: 'jsonv2',
    addressdetails: '1',
    limit: '8',
    countrycodes: 'kr',
    'accept-language': 'ko'
  });
  try {
    const response = await fetch('https://nominatim.openstreetmap.org/search?' + params.toString(), {
      headers: { Accept: 'application/json' }
    });
    if (!response.ok) return [];
    const places = await response.json();
    return places.map(place => ({
      title: place.name || place.display_name?.split(',')[0] || query,
      address: place.display_name || '',
      lat: Number(place.lat),
      lng: Number(place.lon),
      source: place.type || place.class || 'POI'
    })).filter(item => Number.isFinite(item.lat) && Number.isFinite(item.lng));
  } catch (err) {
    console.warn('POI search failed', err);
    return [];
  }
}

function dedupeSearchResults(items) {
  const seen = new Set();
  return items.filter(item => {
    const key = [item.title, item.address, item.lat.toFixed(5), item.lng.toFixed(5)].join('|');
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  }).slice(0, 10);
}

function renderSearchResults(results) {
  const list = document.getElementById('searchResults');
  if (!list) return;
  setSearchHistoryOpen(false);
  activeSearchResults = results;
  if (!results.length) {
    showSearchStatus('검색 결과가 없습니다. 다른 상호, 키워드, 주소로 검색해보세요.');
    return;
  }
  list.innerHTML = results.map((item, index) => (
    '<button class="search-result" type="button" data-index="' + index + '">' +
    '<strong>' + escapeHtml(item.title || '검색 결과') + '</strong>' +
    '<span>' + escapeHtml(item.address || item.source || '') + '</span>' +
    '</button>'
  )).join('');
  list.classList.add('is-open');
  list.querySelectorAll('.search-result').forEach(button => {
    button.addEventListener('click', () => {
      selectSearchResult(Number(button.dataset.index));
    });
  });
}

function selectSearchResult(index) {
  const item = activeSearchResults[index];
  if (!item) return;
  document.querySelectorAll('.search-result').forEach((button, buttonIndex) => {
    button.classList.toggle('is-selected', buttonIndex === index);
  });
  const latlng = new naver.maps.LatLng(item.lat, item.lng);
  setAddressMarker(latlng);
  showRightClickInfo(latlng, '<strong>' + escapeHtml(item.title || '선택 위치') + '</strong><br>' + escapeHtml(item.address || ''));
  map.morph(latlng, 17);
}

async function moveToAddress(query) {
  showSearchStatus('검색 중...');
  const [naverResults, poiResults] = await Promise.all([
    geocodeNaver(query),
    searchOpenStreetMap(query)
  ]);
  const results = dedupeSearchResults([...naverResults, ...poiResults]);
  renderSearchResults(results);
  if (results.length === 1) selectSearchResult(0);
}

function bindAddressSearch() {
  const form = document.getElementById('addressSearch');
  const input = document.getElementById('addressInput');
  form?.addEventListener('submit', (e) => {
    e.preventDefault();
    const query = input.value.trim();
    if (!query) {
      input.focus();
      return;
    }
    rememberSearchQuery(query);
    moveToAddress(query);
  });
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[ch]));
}

function getReverseAddress(response) {
  const address = response?.v2?.address;
  if (address?.roadAddress) return address.roadAddress;
  if (address?.jibunAddress) return address.jibunAddress;
  const result = response?.v2?.results?.[0];
  if (!result) return '';
  const region = result.region || {};
  return [region.area1, region.area2, region.area3, region.area4]
    .map(area => area?.name)
    .filter(Boolean)
    .join(' ');
}

function showRightClickInfo(latlng, content) {
  if (!rightClickInfoWindow) {
    rightClickInfoWindow = new naver.maps.InfoWindow({
      borderWidth: 0,
      disableAnchor: false,
      backgroundColor: 'transparent',
      pixelOffset: new naver.maps.Point(0, -8)
    });
  }
  rightClickInfoWindow.setContent(
    '<div style="padding:12px 14px;border:1px solid rgba(112,115,124,0.22);border-radius:12px;background:#fff;box-shadow:0 4px 16px rgba(23,23,23,.10),0 1px 4px rgba(23,23,23,.07);font-family:\'Pretendard JP\',-apple-system,BlinkMacSystemFont,sans-serif;font-size:13px;font-weight:500;line-height:1.45;color:rgb(23,23,23);max-width:280px;word-break:keep-all;">' +
    content +
    '</div>'
  );
  rightClickInfoWindow.open(map, latlng);
}

function lookupRightClickAddress(latlng) {
  showRightClickInfo(latlng, '주소 확인 중...');
  if (!window.naver || !naver.maps || !naver.maps.Service || !naver.maps.Service.reverseGeocode) {
    showRightClickInfo(latlng, '주소 확인 기능을 불러오지 못했습니다.');
    return;
  }
  naver.maps.Service.reverseGeocode({
    coords: latlng,
    orders: [
      naver.maps.Service.OrderType.ROAD_ADDR,
      naver.maps.Service.OrderType.ADDR
    ].join(',')
  }, (status, response) => {
    if (status !== naver.maps.Service.Status.OK) {
      showRightClickInfo(latlng, '주소를 찾지 못했습니다.');
      return;
    }
    const address = getReverseAddress(response);
    showRightClickInfo(latlng, address ? escapeHtml(address) : '주소를 찾지 못했습니다.');
  });
}

function bindMapRightClick() {
  naver.maps.Event.addListener(map, 'rightclick', (e) => {
    lookupRightClickAddress(e.coord);
  });
  naver.maps.Event.addListener(map, 'click', () => {
    rightClickInfoWindow?.close();
  });
}

// recreate 함수는 아래에서 재정의된 후 래핑됩니다. (파일 끝부분을 참고하세요)

// 체크박스와 오버레이 상태 연결 핸들러
function bindToggleHandlers() {
  const cbSido = document.getElementById('TOGGLE_SIDO');
  // 시도 토글 이벤트
  cbSido?.addEventListener('change', async (e) => {
    const checked = e.target.checked;
    lineLayers.sido.visible = checked;
    if (checked && !lineLayers.sido.loaded) {
      try {
        await loadGeoJSONOnce('sido');
      } catch (err) {
        console.error(err);
        alert('시도 경계 로드 실패. 파일 경로/형식을 확인하세요.');
        lineLayers.sido.visible = false;
        e.target.checked = false;
        return;
      }
    }
    applyVisibility('sido');
  });

  // 시군구(시도별) 토글 이벤트를 동적으로 바인딩
  Object.keys(lineLayers).forEach(key => {
    if (key.startsWith('sigungu_')) {
      const checkbox = document.getElementById('TOGGLE_' + key.toUpperCase());
      checkbox?.addEventListener('change', async (e) => {
        const checked = e.target.checked;
        lineLayers[key].visible = checked;
        if (checked && !lineLayers[key].loaded) {
          try {
            await loadGeoJSONOnce(key);
          } catch (err) {
            console.error(err);
            alert('시군구 경계 로드 실패: ' + key);
            lineLayers[key].visible = false;
            e.target.checked = false;
            updateLineRegionTrigger();
            return;
          }
        }
        applyVisibility(key);
        updateLineRegionTrigger();
      });
    }
  });
}

function closeControlPanels(exceptPanelId = null) {

  if (linePanel && linePanel.id !== exceptPanelId) {
    linePanel.classList.remove('is-open');
    lineButton?.setAttribute('aria-expanded', 'false');
  }

  const opacityPanel = document.getElementById('FILL_OPACITY_PANEL');
  const opacityButton = document.getElementById('TOGGLE_FILL_OPACITY');
  if (opacityPanel && opacityPanel.id !== exceptPanelId) {
    opacityPanel.classList.remove('is-open');
    opacityButton?.setAttribute('aria-expanded', 'false');
  }

  const lineRegionPanel = document.getElementById('LINE_REGION_PANEL');
  const lineRegionButton = document.getElementById('LINE_REGION_DROPDOWN');
  if (lineRegionPanel && lineRegionPanel.id !== exceptPanelId) {
    lineRegionPanel.classList.remove('is-open');
    lineRegionButton?.setAttribute('aria-expanded', 'false');
  }

  const regionPanel = document.getElementById('FILL_REGION_PANEL');
  if (regionPanel && regionPanel.id !== exceptPanelId) {
    regionPanel.classList.remove('is-open');
    document.querySelectorAll('.fill-region-trigger').forEach(button => {
      button.setAttribute('aria-expanded', 'false');
    });
    activeFillRegionKind = null;
  }
}

function positionFloatingPanel(panel, anchor) {
  const anchorRect = anchor.getBoundingClientRect();
  const wrapRect = document.querySelector('.buttons').getBoundingClientRect();
  const panelWidth = panel.offsetWidth || 48;
  const desiredLeft = anchorRect.left - wrapRect.left + (anchorRect.width - panelWidth) / 2;
  const maxLeft = Math.max(0, window.innerWidth - wrapRect.left - panelWidth - 12);
  panel.style.left = Math.max(0, Math.min(desiredLeft, maxLeft)) + 'px';
  panel.style.top = (anchorRect.bottom - wrapRect.top + 6) + 'px';
}

function updateLineRegionTrigger() {
  const trigger = document.getElementById('LINE_REGION_DROPDOWN');
  const count = trigger?.querySelector('.line-region-count');
  if (!trigger || !count) return;
  const selectedCount = Object.keys(lineLayers).filter(key => {
    return key.startsWith('sigungu_') && lineLayers[key].visible;
  }).length;
  count.textContent = selectedCount ? String(selectedCount) : '';
  trigger.classList.toggle('has-active-line', selectedCount > 0);
  trigger.setAttribute('aria-label', '시군구 라인, ' + selectedCount + '개 선택');
}

function bindLineRegionDropdownHandlers() {
  const button = document.getElementById('LINE_REGION_DROPDOWN');
  const panel = document.getElementById('LINE_REGION_PANEL');
  if (!button || !panel) return;

  updateLineRegionTrigger();
  button.addEventListener('click', e => {
    e.stopPropagation();
    const isOpen = !panel.classList.contains('is-open');
    if (!isOpen) {
      closeControlPanels();
      return;
    }
    closeControlPanels(panel.id);
    panel.classList.add('is-open');
    button.setAttribute('aria-expanded', 'true');
    positionFloatingPanel(panel, button);
  });
  panel.addEventListener('click', e => e.stopPropagation());
  window.addEventListener('resize', () => {
    if (panel.classList.contains('is-open')) positionFloatingPanel(panel, button);
  });
}

function updateFillRegionTrigger(kind) {
  const trigger = document.getElementById('FILL_DROPDOWN_' + kind.toUpperCase());
  const count = trigger?.querySelector('.fill-region-count');
  if (!trigger || !count) return;
  const selectedCount = lineLayers[kind].fillItems.filter(item => item.visible).length;
  count.textContent = selectedCount ? String(selectedCount) : '';
  trigger.classList.toggle('has-active-fill', selectedCount > 0);
  trigger.setAttribute('aria-label', trigger.dataset.fillLabel + ' 지역별 채움, ' + selectedCount + '개 선택');
}

function renderFillRegionPanel(kind) {
  const panel = document.getElementById('FILL_REGION_PANEL');
  const trigger = document.getElementById('FILL_DROPDOWN_' + kind.toUpperCase());
  if (!panel || !trigger) return;
  panel.replaceChildren();

  const header = document.createElement('div');
  header.className = 'fill-region-panel-header';
  header.textContent = trigger.dataset.fillLabel + ' 지역별 채움';
  panel.appendChild(header);

  const options = document.createElement('div');
  options.className = 'fill-region-options';
  const fillItems = lineLayers[kind].fillItems;

  const allLabel = document.createElement('label');
  allLabel.className = 'fill-region-option fill-region-option-all';
  const allCheckbox = document.createElement('input');
  allCheckbox.type = 'checkbox';
  allCheckbox.dataset.fillAll = kind;
  allCheckbox.setAttribute('aria-label', trigger.dataset.fillLabel + ' 전체 채움');
  const allName = document.createElement('span');
  allName.textContent = '전체';
  allLabel.append(allCheckbox, allName);
  options.appendChild(allLabel);

  const syncAllCheckbox = () => {
    const selectedCount = fillItems.filter(item => item.visible).length;
    allCheckbox.checked = fillItems.length > 0 && selectedCount === fillItems.length;
    allCheckbox.indeterminate = selectedCount > 0 && selectedCount < fillItems.length;
  };

  allCheckbox.addEventListener('change', () => {
    setAllFillFeatureVisibility(kind, allCheckbox.checked);
    options.querySelectorAll('input[data-fill-index]').forEach(checkbox => {
      checkbox.checked = allCheckbox.checked;
    });
    syncAllCheckbox();
    updateFillRegionTrigger(kind);
  });

  fillItems.forEach((item, itemIndex) => {
    const label = document.createElement('label');
    label.className = 'fill-region-option';

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = item.visible;
    checkbox.dataset.fillKind = kind;
    checkbox.dataset.fillIndex = String(itemIndex);
    checkbox.setAttribute('aria-label', item.name + ' 채움');
    checkbox.addEventListener('change', () => {
      item.visible = checkbox.checked;
      applyFillFeatureVisibility(kind, itemIndex);
      syncAllCheckbox();
      updateFillRegionTrigger(kind);
    });

    const name = document.createElement('span');
    name.textContent = item.name;
    label.append(checkbox, name);
    options.appendChild(label);
  });
  syncAllCheckbox();
  panel.appendChild(options);
}

function bindFillRegionDropdownHandlers() {
  const panel = document.getElementById('FILL_REGION_PANEL');
  if (!panel) return;

  document.querySelectorAll('.fill-region-trigger').forEach(trigger => {
    const kind = trigger.dataset.fillKind;
    updateFillRegionTrigger(kind);
    trigger.addEventListener('click', async (e) => {
      e.stopPropagation();
      const isCurrentOpen = panel.classList.contains('is-open') && activeFillRegionKind === kind;
      if (isCurrentOpen) {
        closeControlPanels();
        return;
      }

      closeControlPanels('FILL_REGION_PANEL');
      document.querySelectorAll('.fill-region-trigger').forEach(button => {
        button.setAttribute('aria-expanded', 'false');
      });
      activeFillRegionKind = kind;
      trigger.setAttribute('aria-expanded', 'true');
      panel.classList.add('is-open');
      panel.innerHTML = '<div class="fill-region-loading">지역 목록을 불러오는 중…</div>';
      positionFloatingPanel(panel, trigger);

      try {
        await loadFillGeoJSONOnce(kind);
        if (activeFillRegionKind !== kind || !panel.classList.contains('is-open')) return;
        renderFillRegionPanel(kind);
        positionFloatingPanel(panel, trigger);
      } catch (err) {
        console.error(err);
        if (activeFillRegionKind === kind) {
          panel.innerHTML = '<div class="fill-region-error">지역 목록을 불러오지 못했습니다.</div>';
          positionFloatingPanel(panel, trigger);
        }
      }
    });
  });

  panel.addEventListener('click', e => e.stopPropagation());
  window.addEventListener('resize', () => {
    if (!panel.classList.contains('is-open') || !activeFillRegionKind) return;
    const trigger = document.getElementById('FILL_DROPDOWN_' + activeFillRegionKind.toUpperCase());
    if (trigger) positionFloatingPanel(panel, trigger);
  });
}

function bindFillOpacityHandlers() {
  const button = document.getElementById('TOGGLE_FILL_OPACITY');
  const panel = document.getElementById('FILL_OPACITY_PANEL');
  const slider = document.getElementById('FILL_OPACITY');
  const value = document.getElementById('FILL_OPACITY_VALUE');
  if (!button || !panel || !slider || !value) return;

  const updateValue = () => {
    const percent = Math.max(0, Math.min(100, Number(slider.value)));
    value.textContent = percent + '%';
    setAllFillOpacities(percent / 100);
  };

  updateValue();
  button.addEventListener('click', e => {
    e.stopPropagation();
    const isOpen = !panel.classList.contains('is-open');
    if (!isOpen) {
      closeControlPanels();
      return;
    }
    closeControlPanels(panel.id);
    panel.classList.add('is-open');
    button.setAttribute('aria-expanded', 'true');
    positionFloatingPanel(panel, button);
  });
  panel.addEventListener('click', e => e.stopPropagation());
  slider.addEventListener('input', updateValue);
  window.addEventListener('resize', () => {
    if (panel.classList.contains('is-open')) positionFloatingPanel(panel, button);
  });
}

function bindWeightHandlers() {
  const control = document.getElementById('LINE_WEIGHT_CONTROL');
  const button = document.getElementById('TOGGLE_LINE_WEIGHT');
  const panel = document.getElementById('LINE_WEIGHT_PANEL');
  const slider = document.getElementById('LINE_WEIGHT');
  const value = document.getElementById('LINE_WEIGHT_VALUE');
  if (!control || !button || !panel || !slider || !value) return;

  const updateValue = () => {
    const weight = Number(slider.value);
    value.textContent = Number.isInteger(weight) ? String(weight) : weight.toFixed(1);
    setAllLayerWeights(weight);
  };

  updateValue();

  button.addEventListener('click', (e) => {
    e.stopPropagation();
    const isOpen = !panel.classList.contains('is-open');
    if (!isOpen) {
      closeControlPanels();
      return;
    }
    closeControlPanels(panel.id);
    panel.classList.add('is-open');
    button.setAttribute('aria-expanded', 'true');
    positionFloatingPanel(panel, button);
  });

  panel.addEventListener('click', (e) => {
    e.stopPropagation();
  });

  slider.addEventListener('input', updateValue);

  window.addEventListener('resize', () => {
    if (panel.classList.contains('is-open')) positionFloatingPanel(panel, button);
  });
}

function setUiVisible(visible) {
  const button = document.getElementById('TOGGLE_UI_VISIBILITY');
  document.body.classList.toggle('ui-hidden', !visible);
  if (!button) return;
  button.textContent = visible ? 'UI 숨김' : 'UI 표시';
  button.setAttribute('aria-pressed', String(!visible));
  if (!visible) {
    closeControlPanels();
    hideSearchResults();
    setSearchHistoryOpen(false);
    rightClickInfoWindow?.close();
  }
}

function bindUiVisibilityToggle() {
  const button = document.getElementById('TOGGLE_UI_VISIBILITY');
  if (!button) return;
  button.addEventListener('click', e => {
    e.stopPropagation();
    setUiVisible(document.body.classList.contains('ui-hidden'));
  });
  setUiVisible(true);
}

function initMap(){
  createMap({ mapTypeId: naver.maps.MapTypeId.NORMAL, customStyleId: null });
  ensureFillCanvasOverlay();

  document.getElementById('WHITE').addEventListener('click', () => switchToTheme(STYLE_WHITE, 'WHITE'));
  document.getElementById('DARK').addEventListener('click', () => switchToTheme(STYLE_DARK, 'DARK'));
  document.getElementById('BLUE').addEventListener('click', () => switchToTheme(STYLE_BLUE, 'BLUE'));
  document.getElementById('BLUENOSB').addEventListener('click', () => switchToTheme(STYLE_BLUE_NOSB, 'BLUENOSB'));

  document.getElementById('NORMAL').addEventListener('click', () => switchToType(naver.maps.MapTypeId.NORMAL, 'NORMAL'));
  document.getElementById('TERRAIN').addEventListener('click', () => switchToType(naver.maps.MapTypeId.TERRAIN, 'TERRAIN'));
  document.getElementById('SATELLITE').addEventListener('click', () => switchToType(naver.maps.MapTypeId.SATELLITE, 'SATELLITE'));
  document.getElementById('HYBRID').addEventListener('click', () => switchToType(naver.maps.MapTypeId.HYBRID, 'HYBRID'));

  bindToggleHandlers();
  bindLineRegionDropdownHandlers();
  bindFillToggleHandlers();
  bindFillRegionDropdownHandlers();
  bindColorHandlers();
  bindFillColorHandlers();
  bindFillBlendModeHandlers();
  bindFillOpacityHandlers();
  bindWeightHandlers();
  bindSearchHistory();
  bindUiVisibilityToggle();
  document.addEventListener('click', () => closeControlPanels());
  window.addEventListener('resize', requestFillCanvasRedraw);
  bindAddressSearch();
  bindAddressMarkerToggle();
}
window.initMap = initMap;

function createMap(extraOptions = {}){
  map = new naver.maps.Map('map', Object.assign({}, BASE_OPTIONS, extraOptions));
  bindMapRightClick();
}

function recreate(options = {}, doneActiveId = null){
  if (recreating) return;
  recreating = true;
  const center = map.getCenter();
  const zoom = map.getZoom();
  const wrap = document.getElementById('mapWrap');
  const old = document.getElementById('map');
  fillCanvasOverlay?.setMap(null);
  const fresh = document.createElement('div');
  fresh.id = 'map'; fresh.style.width = '100%'; fresh.style.height = '100%';
  wrap.replaceChild(fresh, old);
  createMap(Object.assign({ center, zoom }, options));
  if (doneActiveId) setActive(doneActiveId);
  setTimeout(()=>{ recreating = false; }, 80);
}

// recreate 을 오버레이 복원 기능으로 래핑합니다. 이 코드는 recreate 정의 이후에 위치해야 합니다.
const __recreateOrig = recreate;
recreate = function(options = {}, doneActiveId = null){
  __recreateOrig(options, doneActiveId);
  // 새 지도가 준비된 직후, 기존 오버레이를 복원합니다.
  setTimeout(restoreAllOverlaysOnNewMap, 100);
};

function setActive(id){
  document.querySelectorAll('.control-btn').forEach(b => b.classList.remove('control-on'));
  document.getElementById(id).classList.add('control-on');
}

function switchToTheme(styleId, btnId){
  recreate({ mapTypeId: naver.maps.MapTypeId.NORMAL, customStyleId: styleId }, btnId);
}

function switchToType(typeId, btnId){
  recreate({ mapTypeId: typeId, customStyleId: null }, btnId);
}
</script>
